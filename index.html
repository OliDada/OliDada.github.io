<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" href="images/dolphin2.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Baloo+2:wght@600;700;800&family=Bungee&family=Comic+Neue:wght@700&family=Nunito:wght@500;600;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
    <link href="site.css" rel="stylesheet">
    <link href="bit.css" rel="stylesheet">
    <script src="script.js" defer></script>
    <script src="site.js" defer></script>
    <script src="bit.js" defer></script>
    <title>Oli.is</title>
  </head>
  <body>
    <canvas id="three-canvas" class="three-canvas" aria-hidden="true"></canvas>
    <div class="wrap">
      <header class="site-header">
        <a class="brand" href="/">
          <img src="images/dolphin1.png" alt="">
          <span>
            <span class="brand-name disp">Oli.is</span>
            <span class="brand-tag">Games and stuff</span>
          </span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <a class="btn" href="/" aria-current="page">Games</a>
          <a class="btn" href="/jokes.html">Jokes</a>
          <button type="button" id="customiseBtn" class="btn btn-yellow" aria-expanded="false" aria-controls="customise">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7.5" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
            <span class="btn-label">Customise</span>
          </button>
        </nav>
      </header>
      <main style="display:flex;flex-direction:column;gap:44px">
        <section id="hero" class="hero">
          <h1 class="hero-title disp">Games and stuff</h1>
          <p class="sub_title"></p>
        </section>

        <!-- In-page player: script.js shows it when a game is played -->
        <section id="playerArea" class="player-area" aria-hidden="true" style="display:none;">
          <div class="player-header">
            <div class="player-info">
              <h2 id="playerTitle" class="player-title"></h2>
              <div id="playerSubtitle" class="player-subtitle"></div>
              <div id="playerDescription" class="player-desc" aria-live="polite"></div>
            </div>
            <div class="player-actions">
              <button id="toggleControls" class="btn small controls-btn" title="See the controls for this game" hidden aria-expanded="false" aria-controls="playerControls"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="6"/><path d="M7 10v4M5 12h4"/><circle cx="15.5" cy="11" r="1" fill="currentColor"/><circle cx="18" cy="13.5" r="1" fill="currentColor"/></svg><span class="lbl">Controls</span></button>
              <a id="openNewTab" class="btn small" href="#" target="_blank" rel="noopener" title="Open in new tab"><span class="ico" aria-hidden="true">&#8599;</span><span class="lbl">New tab</span></a>
              <button id="toggleFullscreen" class="btn small" title="Fullscreen"><span class="ico" aria-hidden="true">&#x26F6;</span><span class="lbl">Fullscreen</span></button>
              <button id="closePlayer" class="btn small" title="Close"><span class="ico" aria-hidden="true">&#x2715;</span><span class="lbl">Close</span></button>
            </div>
          </div>
          <ul id="playerControls" class="player-controls" hidden></ul>
          <div id="playerStage" class="player-stage">
            <div id="playerAspectBox" class="player-aspect-box">
              <iframe id="playerFrameMain" src="about:blank" title="Game player" allowfullscreen allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope"></iframe>
            </div>
          </div>
        </section>

        <!-- Cards are filled in by site.js from data/projects.json -->
        <article id="feature" class="feature stk" aria-label="Featured game"></article>

        <section id="games" aria-labelledby="gamesTitle">
          <h2 id="gamesTitle" class="section-title disp">More games</h2>
          <div id="gameGrid" class="grid"></div>
        </section>

        <section class="bottom-row">
          <div id="jokes" class="joke-note">
            <p class="label">Brandari dagsins</p>
            <p id="jokeText" class="joke-text" lang="is" aria-live="polite"></p>
            <div class="actions">
              <button type="button" id="jokeBtn" class="btn">Annan!</button>
              <a class="btn" href="/jokes.html">All jokes</a>
            </div>
          </div>
          <div id="shelf" class="shelf stk">
            <div>
              <h2 class="disp">Other stuff</h2>
              <p>Smaller games and experiments.</p>
            </div>
            <div id="shelfGrid" class="shelf-grid"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="projectModal" class="modal" aria-hidden="true">
      <div class="modal-inner">
        <button id="modalClose" class="modal-close" aria-label="Close">✕</button>
        <iframe id="projectFrame" src="about:blank" title="Project preview"></iframe>
      </div>
    </div>
  </body>
</html>
