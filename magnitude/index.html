<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magnitude</title>
<link rel="icon" href="/images/logo-favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="hl"><a class="back" href="/daily.html" target="_top" aria-label="Back to daily games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><div class="logo">MAGNITUDE<i>.</i> <span id="dayNo"></span></div></div>
    <div class="hr"><div class="dots" id="dots"></div><button class="mute" id="mute" aria-label="Sound on"></button></div>
  </header>

  <div id="play" class="col">
    <div class="qcard">
      <div class="qtop"><div class="badge" id="emoji"></div><span id="count"></span></div>
      <h1 id="question"></h1>
      <p class="hint" id="hint"></p>
    </div>

    <div class="readout"><div class="odo" id="odo"></div><div class="unit" id="unit"></div></div>

    <div class="scale" id="scale">
      <div class="track"><div class="fill" id="fill"></div><div class="gap" id="gap"></div></div>
      <div class="ticks" id="ticks"></div>
      <div class="pin you" id="you"><span>you</span></div>
      <div class="pin real" id="real"><span>real</span></div>
      <div class="thumb" id="thumb" role="slider" tabindex="0" aria-label="Your estimate"></div>
    </div>

    <div class="row" id="controls">
      <button class="nudge" id="minus" aria-label="A bit less">−</button>
      <button class="btn" id="lock">Lock it in</button>
      <button class="nudge" id="plus" aria-label="A bit more">+</button>
    </div>

    <div class="result" id="result">
      <div class="vrow"><div class="pill" id="pill"></div><div class="vtxt" id="vtxt"></div></div>
      <div class="fact" id="fact"></div>
      <button class="btn" id="next">Next</button>
    </div>
  </div>

  <div class="end" id="end">
    <div class="sub">Magnitude <span id="endDay"></span> · today's score</div>
    <div class="big" id="total"></div>
    <div class="rcard" id="rcard"></div>
    <button class="btn" id="share">Share result</button>
    <div class="stats" id="stats"></div>
    <div class="countdown">Next set in <b id="countdown"></b></div>
  </div>
</div>
<script src="questions.js"></script>
<script src="game.js"></script>
</body>
</html>
