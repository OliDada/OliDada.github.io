<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Valley</title>
<link rel="stylesheet" href="menu-font.css?v=1">
<style>
:root{--bg:#0c0d16;--fg:#f6ecd6;--muted:#d9cdb8;--panel:rgba(22,20,34,.72);--line:rgba(246,236,214,.28);--accent:#f2b45c;--accent-ink:#22160a;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:Georgia,serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;image-rendering:pixelated;cursor:crosshair}
.ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 9vh);pointer-events:none}
.card{pointer-events:auto;max-width:26rem;text-align:center;background:var(--panel);border:1px solid var(--line);padding:1.3rem 1.6rem 1.3rem;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
h1{font-weight:400;font-size:2.6rem;line-height:1.05;margin:0 0 .4rem}
.card p{margin:.35rem 0;color:var(--muted);font-size:1.08rem;line-height:1.45}
.card .keys{font-style:italic;font-size:1rem}
button{font:inherit;font-size:1.15rem;color:var(--accent-ink);background:var(--accent);border:0;padding:.55rem 1.4rem;margin-top:.9rem;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font-style:italic;font-size:1rem;opacity:0;transition:opacity 1.2s;pointer-events:none;text-shadow:0 1px 4px #000,0 0 10px #000}
#msg{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 13%);text-align:center;font-size:1.6rem;line-height:1.35;padding:0 24px;opacity:0;transition:opacity 1.6s;pointer-events:none;text-shadow:0 1px 4px #000,0 0 14px #000}
#msg small{display:block;font-size:1rem;font-style:italic;color:var(--muted)}
#ring{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border:2px solid rgba(246,236,214,.3);border-radius:50%;display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(246,236,214,.28)}
#err{display:none}
#jump{display:none;position:fixed;right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:70px;height:70px;margin:0;padding:0;border-radius:50%;font-size:1rem;background:rgba(22,20,34,.55);color:var(--fg);border:2px solid var(--line);touch-action:none}
#swing{display:none;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 52px);width:76px;height:76px;margin:0;padding:0;border-radius:50%;font-size:1.05rem;background:rgba(22,20,34,.55);color:var(--fg);border:2px solid var(--line);touch-action:none}
@media (prefers-reduced-motion: reduce){#hint,#msg{transition:none}}
</style>
<link rel="stylesheet" href="arrival.css?v=4">
</head>
<body>
<canvas id="view" aria-label="A first-person view from a forest path, looking out over a valley to a castle and mountains"></canvas>
<div class="ov" id="start">
  <div class="card title-menu">
    <h1><span>THE</span>VALLEY</h1>
    <nav class="menu-options" aria-label="Main menu">
      <button id="go" type="button">New game</button>
      <button id="controlsToggle" type="button" aria-expanded="false" aria-controls="menuControls">Controls</button>
    </nav>
    <div id="menuControls" hidden>
      <p class="keys" id="keys">WASD / arrows — Move<br>Mouse — Look · Shift — Run<br>E — Talk / take · I — Bag · M — Map<br>J — Journal<br>X — Draw / sheathe · F / click — Swing<br>V — Block · Space — Jump<br>Q — Torch · C — Sneak · Hold T — Wait</p>
      <button id="controlsBack" type="button">Back</button>
    </div>
    <p id="err" role="alert">The valley could not load. Check your connection and reload.</p>
  </div>
</div>
<div id="hint"></div>
<div id="msg"><span id="msgT"></span><small id="msgS"></small></div>
<div id="ring"><div id="knob"></div></div>
<button id="swing" type="button">Swing</button>
<button id="jump" type="button">Jump</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const coarse=matchMedia('(pointer: coarse)').matches;
if(coarse) $('#keys').textContent='Drag on the left to walk. Drag on the right to look. Push the stick far out to run. Tap Torch for light. Tap Jump to jump, Swing to swing, and hold Swing to block. Tap Bag to see what you carry, Map to see where you are.';
if(typeof THREE==='undefined'){ $('#err').style.display='block'; $('#go').style.display='none'; return; }

/* ================= helpers ================= */
let seed=771;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const R=(a,b)=>a+(b-a)*rnd();
const pick=a=>a[(rnd()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){return vn(x,y)*.55+vn(x*2.03+5.2,y*2.03+9.1)*.28+vn(x*4.1+1.7,y*4.1+3.3)*.17;}
function ridged(x,z){let s=0,a=.55,f=1,w=1;for(let i=0;i<4;i++){let n=1-Math.abs(vn(x*f+i*7.3,z*f-i*3.1)*2-1);n*=n;n*=w;w=clamp(n*1.7,0,1);s+=n*a;f*=2.15;a*=.5;}return s;}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');return [c,g];}
function tex(c,repeat,crisp){const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;
  if(crisp){t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;} else t.minFilter=THREE.LinearMipmapLinearFilter;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;} return t;}
function dabs(g,n,x0,y0,w,h,cols,sw,sh){for(let i=0;i<n;i++){g.fillStyle=cols[(rnd()*cols.length)|0];g.fillRect((x0+rnd()*w)|0,(y0+rnd()*h)|0,sw||3,sh||2);}}
function wrapDabs(g,S,n,cols,sw,sh){for(let i=0;i<n;i++){g.fillStyle=cols[(rnd()*cols.length)|0];const x=(rnd()*S)|0,y=(rnd()*S)|0;
  for(const ox of [0,-S])for(const oy of [0,-S])g.fillRect(x+ox,y+oy,sw,sh);}}
function spline(pts,step){const out=[],Q=i=>pts[clamp(i,0,pts.length-1)];
  for(let i=0;i<pts.length-1;i++){const p0=Q(i-1),p1=Q(i),p2=Q(i+1),p3=Q(i+2),n=Math.max(2,Math.round(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t,o=[];
      for(let c=0;c<2;c++)o.push(.5*(2*p1[c]+(-p0[c]+p2[c])*t+(2*p0[c]-5*p1[c]+4*p2[c]-p3[c])*t2+(-p0[c]+3*p1[c]-3*p2[c]+p3[c])*t3));
      out.push(o);}}
  out.push(pts[pts.length-1].slice());return out;}
function makeHash(cell){const m=new Map();return {
  add(x,z,v){const k=((Math.floor(x/cell)+512)<<10)|(Math.floor(z/cell)+512);let a=m.get(k);if(!a)m.set(k,a=[]);a.push([x,z,v]);},
  near(x,z){const cx=Math.floor(x/cell)+512,cz=Math.floor(z/cell)+512;let bd=1e9,bv=null;
    for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=m.get(((cx+i)<<10)|(cz+j));if(!a)continue;
      for(const p of a){const d=(p[0]-x)*(p[0]-x)+(p[1]-z)*(p[1]-z);if(d<bd){bd=d;bv=p[2];}}}
    return bv===null?null:[Math.sqrt(bd),bv];}};}

/* ================= the shape of this view =================
   You start deep in the forest (z>0), walking north (-z). The path is short and keeps the castle
   in the gap between the trunks. At the forest edge the land drops to a meadow and a stream, then
   rises to the village. Behind the village the valley steps up onto a broad shelf: a broken rock
   edge in the middle (where the stream falls over it), a long gentle slope on the left that the
   castle road zigzags up. The castle stands on the lip of the shelf, looking down on the village.
   Behind it the shelf rises into foothills and then the mountains. */
const CX=40,CZ=-660,CS=1.6;                              // castle centre and scale
const V=[16,-276];                                       // village square
// the west: lowered hills, the lake town on the east shore of a lake, a ruined tower by the road
const LK={x:-1072,z:-408,rx:212,rz:146},ISLE={x:-1108,z:-436,rx:36,rz:25},TOWN_C=[-800,-392],RUIN=[-520,-326];
const POND={x:-262,z:-302,rx:42,rz:24},CROSS=[-430,-357];let INN=[-446,-380];
const CRAGS=[[-530,-730,34,38],[-480,-708,26,29]];          // twin rock pillars with towers on top, the landmark between the valley and the lake
// the east: a hanging valley up in the hills holding the Old Wood: a stone circle, a witch's cottage, the Elder tree
const OW={SC:[500,-300],WC:[642,-250],GT:[650,-342]};
// nothing in nature runs along a ruler: every big region is drawn through a slow wobble so its edge wanders
function wob(x,z,k){return (fbm(x*.0052+k,z*.0052+k*1.7)-.5)*2;}
function forestEdge(x){return (vn(x*.011+31,7.7)-.5)*90*smooth(25,120,Math.abs(x+5));}     // the forest's northern edge bulges and bays; straight only where the path leaves it
function eastW(x0,z0){const x=x0+60*wob(x0,z0,13),z=z0+45*wob(x0,z0,17);return smooth(195,330,x)*(1-smooth(745,800,x))*smooth(-150,-205,z)*(1-smooth(-385,-440,z));}
function oldW(x0,z0){const x=x0+60*wob(x0,z0,13),z=z0+45*wob(x0,z0,17);return smooth(320,380,x)*(1-smooth(735,780,x))*smooth(-195,-222,z)*(1-smooth(-362,-392,z));}
function owClear(x,z){return Math.min(Math.hypot(x-OW.SC[0],z-OW.SC[1])/30,Math.hypot(x-OW.WC[0],z-OW.WC[1])/24,Math.hypot(x-OW.GT[0],z-OW.GT[1])/22);}
// farmland: a few open fields of hedged plots on the flat ground by the roads out of each settlement. [x, z, half-length, half-width, turn]
const FIELDS=[[100,-250,84,42,.25],[-80,-250,72,44,-.3],[160,-332,62,38,.1],[70,-168,66,27,.12],
  [-700,-316,88,36,.12],[-680,-410,72,36,-.1],[-778,-304,48,32,.5]];
const FKEEP=[[V[0],V[1],58],[TOWN_C[0],TOWN_C[1],72]];
function lowW(x0,z0){const x=x0+90*wob(x0,z0,3),z=z0+100*wob(x0,z0,8);return smooth(-200,-420,x)*smooth(-1750,-1400,x)*smooth(-40,-150,z)*smooth(-820,-660,z);}
const SUN=new THREE.Vector3(-.78,.40,.30).normalize();   // direction towards the sun: low, from the west
const PEAKS=[[-2750,-560,520,950],[-2200,-950,380,620],[-2700,-150,520,760],[-2500,-1150,480,820],[300,-2600,520,980],[-560,-2150,420,700],[1000,-2900,620,950],[-1350,-3000,700,1050],[-60,-3300,620,760],[700,-1950,320,460],[-250,-1700,260,300]];
function mtn(x,z){const wx=x+240*(vn(x*.0018,z*.0018)-.5),wz=z+240*(vn(x*.0018+5.3,z*.0018+2.9)-.5);
  let s=0,a=.62,f=.0011,w=1;for(let i=0;i<4;i++){let n=1-Math.abs(vn(wx*f+i*7.3,wz*f-i*3.1)*2-1);n=Math.pow(n,1.7);n*=w;w=clamp(n*1.4,0,1);s+=n*a;f*=2.05;a*=.4;}return s;}
const streamHash=makeHash(24),valeHash=makeHash(170);
// A long wooded ascent; only the waterfall cuts a steep local escarpment.
function fallRidge(x){return Math.exp(-(((x-170)/48)**2));}
function edgeZ(x){return -422+22*Math.sin(x*.013+1)+30*smooth(-40,-150,x);}
function edgeW(x){return lerp(190+28*Math.sin(x*.018),19,fallRidge(x));}
function shelfT(x,z){const e=edgeZ(x)+(vn(x*.03,z*.03)-.5)*10;return smooth(e,e-edgeW(x),z);}
function rawH(x,z,noStream){
  const n=fbm(x*.012+3,z*.012+7);
  let h=4+7*n;
  h+=24*smooth(-178,-96,z+forestEdge(x))*(1-smooth(150,320,Math.abs(x)));     // the forest shelf you start on
  h+=11*smooth(-222,-300,z);                                     // the village shelf
  h+=12*smooth(-300,-390,z);                                     // rising ground behind the village
  const st=shelfT(x,z);h+=58*st;                                 // the great shelf
  {const b=st*(1-st)*4;h+=b*((vn(x*.09,z*.09)-.5)*14+(vn(x*.23,z*.23)-.5)*6+(1-Math.abs(vn(x*.12,z*.02)*2-1))*5);
    const step=5.5,f=h/step-Math.floor(h/step),tq=(Math.floor(h/step)+smooth(.55,.95,f))*step;h=lerp(h,tq,b*(.18+.67*fallRidge(x)));}   // the edge breaks into ledges and rock bands
  h+=12*(fbm(x*.02+4,z*.02+9)-.5)*smooth(-470,-560,z);           // rolling ground up on the shelf
  h+=110*smooth(-760,-1100,z)*(.7+.6*fbm(x*.004+2,z*.004));      // foothills
  h+=110*smooth(160,420,z);                                      // hills behind the forest
  const cl=24+36*Math.sin(z*.0045+.6),ax=Math.abs(x-cl)+38*wob(x,z,23),w0=170+.16*Math.max(0,-z);
  const lw=lowW(x,z),rk=1-lw*.94;
  h+=rk*(80+.22*Math.max(0,-z))*smooth(w0,w0+340,ax)*(.55+.9*fbm(x*.006+9,z*.006+1));
  h+=rk*(36*smooth(w0+40,w0+200,ax)*mtn(x*3,z*3)+12*(vn(x*.05,z*.05)-.5)*smooth(w0,w0+120,ax));
  if(lw>0){h+=lw*(16*fbm(x*.007+1,z*.007+5)-5+5*Math.exp(-((x-RUIN[0])**2+(z-RUIN[1])**2)/500));}   // rolling meadows, a knoll for the ruin
  const m=smooth(-1250,-1950,z);
  if(m>0)h+=m*(90+520*mtn(x,z)+80*mtn(x*4.3+11,z*4.3-7));
  for(const p of PEAKS){const d2=(x-p[0])*(x-p[0])+(z-p[1])*(z-p[1]);if(d2<9*p[2]*p[2])h+=p[3]*Math.exp(-d2/(p[2]*p[2]))*(.8+.45*mtn(x*2.2,z*2.2)+.12*mtn(x*7,z*7));}
  h*=1-smooth(-4300,-4800,z);
  {const ew=eastW(x,z);if(ew>0){let t=lerp(26,80,smooth(225,470,x))+9*(fbm(x*.017+11,z*.017+3)-.5);
     t+=3.2*Math.exp(-((x-OW.SC[0])**2+(z-OW.SC[1])**2)/260);for(const p of [OW.WC,OW.GT])t=lerp(t,lerp(26,80,smooth(225,470,p[0])),smooth(30,14,Math.hypot(x-p[0],z-p[1])));
     h=lerp(h,t,ew);}}
  for(const [cx,cz,r,ht] of CRAGS){const d=Math.hypot(x-cx,z-cz)+(vn(x*.12,z*.12)-.5)*9;if(d<r*4.5){const top=ht*smooth(r*3.8,r*.45,d),skirt=ht*.35*smooth(r*4.5,r,d);h+=Math.max(top+(vn(x*.3,z*.05)-.5)*6*smooth(r*1.1,r*.7,d),skirt);}}
  if(!noStream){{const v=valeHash.near(x,z);if(v){const [lv,sl,wd,wt]=v[1],t=smooth(wd,wd*.55,v[0])*wt;if(t>0)h=lerp(h,Math.min(h,lv+.4+Math.max(0,v[0]-5)*sl),t);}}   // the stream's own valley
    const q=streamHash.near(x,z);if(q){const t=smooth(10,2.5,q[0]);if(t>0)h=lerp(h,Math.min(h,q[1]-.9),t);}}
  return h;
}
const CTOP=(function(){let s=0;for(const [dx,dz] of [[0,0],[40,10],[-40,10],[40,-40],[-40,-40]])s+=rawH(CX+dx,CZ+dz,true);return s/5;})();
// the stream comes across the shelf, falls over its edge, and runs down through the meadows
const STREAM=spline([[262,-1010],[246,-940],[228,-870],[214,-800],[200,-700],[188,-600],[178,-520],[172,-462],[168,-432],[166,-420],[164,-408],[158,-382],[146,-346],[132,-312],[104,-262],[60,-228],[10,-212],[-40,-202],[-110,-182],[-190,-150],[-262,-120],[-318,-80],[-350,-30],[-366,30],[-392,90],[-440,146],[-496,204],[-536,272],[-556,340]],4);
STREAM.forEach(p=>{p[2]=rawH(p[0],p[1],true)-1.3;});
for(let i=1;i<STREAM.length;i++)STREAM[i][2]=Math.min(STREAM[i][2],STREAM[i-1][2]-.03);
STREAM.forEach(p=>streamHash.add(p[0],p[1],p[2]));
const ROAD_DEF={
  forest:[[2,86],[-5,58],[4,28],[-3,-4],[5,-38],[-2,-72],[-7,-104],[-17,-134]],
  meadow:[[-17,-134],[-25,-158],[-21,-173],[-11,-187],[-1,-201],[9,-215],[19,-229],[24,-244],[16,-262],[16,-276]],
  castle:[[16,-276],[-14,-296],[-52,-318],[-92,-344],[-128,-372],[-155,-410],[-178,-454],[-142,-494],[-166,-536],[-126,-576],[-146,CZ+40],[-106,CZ-10],[-80,CZ-8],[-60,CZ-6.4]]
};
ROAD_DEF.west=[[-92,-344],[-140,-350],[-200,-362],[-270,-358],[-340,-348],[-420,-356],[-500,-366],[-580,-356],[-660,-350],[-730,-362],[-785,-380],[-815,-390]];
ROAD_DEF.east=[[16,-276],[50,-286],[95,-292],[140,-293],[190,-287],[240,-276],[285,-262],[325,-258],[356,-274],[368,-302],[398,-321],[436,-319],[470,-307],[500,-300]];
ROAD_DEF.owitch=[[500,-300],[540,-291],[578,-276],[612,-262],[636,-254]];
ROAD_DEF.oelder=[[540,-291],[574,-304],[606,-322],[634,-336]];
ROAD_DEF.track=[[-430,-357],[-408,-336],[-366,-319],[-308,-307]];
ROAD_DEF.service=[[-146,CZ+40],[-120,CZ+70],[-70,CZ+93],[-20,CZ+105],[40,CZ+110],[92,CZ+105]];
const roads={},roadHash=makeHash(24);
for(const k in ROAD_DEF){const pts=spline(ROAD_DEF[k],2.5),hs=pts.map(p=>rawH(p[0],p[1],true)),n=hs.length;
  for(const e of [0,n-1]){const q=roadHash.near(pts[e][0],pts[e][1]);if(q&&q[0]<4)hs[e]=q[1];}
  if(k==='castle')hs[n-1]=CTOP;
  for(let pass=0;pass<14;pass++){const o=hs.slice();for(let i=1;i<n-1;i++)hs[i]=(o[Math.max(0,i-2)]+o[i-1]+o[i]+o[i+1]+o[Math.min(n-1,i+2)])/5;}
  pts.forEach((p,i)=>{p[2]=hs[i];});roads[k]=pts;pts.forEach(p=>roadHash.add(p[0],p[1],p[2]));}
function roadDist(x,z){const q=roadHash.near(x,z);return q?q[0]:99;}
// the lake's surface sits just below the lowest point of its shore
const LAKEY=rawH(-862,-388,true)-5;
// the lake: bays and headlands, except along the town's waterfront (east) which stays put for the pier
function lakeD(x,z){const dx=(x-LK.x)/LK.rx,dz=(z-LK.z)/LK.rz,a=Math.atan2(dz,dx),k=1-Math.exp(-a*a*3);
  const lobes=.1*Math.sin(a*2+1.1)+.07*Math.sin(a*3-.6)+.05*Math.sin(a*5+2.2)+(fbm(x*.006+40,z*.006+12)-.5)*.3-.08*smooth(2.3,3.1,Math.abs(a));
  const d=Math.hypot(dx,dz)/(1+k*lobes)+(vn(x*.02,z*.02)-.5)*.1,id=isleD(x,z);
  return id<1?Math.max(d,1.02+(1-id)*1.2):d;}
function isleD(x,z){const dx=(x-ISLE.x)/ISLE.rx,dz=(z-ISLE.z)/ISLE.rz,a=Math.atan2(dz,dx);return Math.hypot(dx,dz)/(1+.18*Math.sin(a*2+.8)+.1*Math.sin(a*3+2.6))+(vn(x*.06,z*.06)-.5)*.14;}
// where a shape function d(x,z)=lim meets each ray from the centre: used to cut the water and plant the reeds
function shoreRing(c,d,lim,n){const out=[];for(let i=0;i<n;i++){const a=i/n*6.2832;let r=.4;for(let q=.4;q<1.7;q+=.01)if(d(c.x+Math.cos(a)*c.rx*q,c.z+Math.sin(a)*c.rz*q)<lim)r=q;out.push(r);}return out;}
const LAKE_R=shoreRing(LK,lakeD,1,180);
