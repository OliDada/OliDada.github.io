<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<title>Niceland</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Niceland: an isometric pixel-art god sandbox of Iceland, every house at true scale.">
<link rel="icon" href="../images/dolphin2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#0b1622;overflow:hidden}</style>
</head>
<body>
<style>
/* Layout: full-bleed pixel diorama canvas; brand + stats top-left, controls + inspector top-right, god dock bottom-centre */
:root{
  --fjord:#0d1822; --panel:rgba(13,24,34,.92); --line:#2a3f52; --deep:#050b11;
  --snow:#eef3f6; --mist:#9db1c0; --lupine:#a387ec; --sulfur:#f0c75e; --ember:#ff7a3d;
  --f-display:'Silkscreen','Courier New',monospace; --f-ui:'Pixelify Sans',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#18385a;color:var(--snow);font-family:var(--f-ui);font-size:14px}
#cv{position:fixed;left:0;top:0;transform-origin:0 0;will-change:transform;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair;display:block}
button,select{font-family:var(--f-ui)}
button:focus-visible,select:focus-visible{outline:2px solid var(--sulfur);outline-offset:1px}
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px var(--deep),0 6px 0 rgba(0,0,0,.3)}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:grid;gap:10px;pointer-events:none;z-index:2}
.brand{font-family:var(--f-display);font-size:26px;line-height:1;letter-spacing:.03em;text-shadow:2px 2px 0 var(--deep)}
.brand small{display:block;margin-top:5px;font-family:var(--f-ui);font-size:12px;color:var(--mist);letter-spacing:.1em;text-transform:uppercase;text-shadow:1px 1px 0 var(--deep)}
#stats{pointer-events:auto;display:grid;grid-template-columns:repeat(6,auto);justify-self:start}
.stat{padding:6px 11px;border-right:2px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:10.5px;color:var(--mist);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.stat.hot b{color:var(--ember)}
#ctrl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:min(760px,62vw);z-index:2}
.grp{display:flex}
.btn{font-weight:500;font-size:13px;color:var(--snow);background:var(--panel);border:2px solid var(--line);padding:6px 10px;cursor:pointer;white-space:nowrap}
select.btn{padding:5px 6px;max-width:150px}
#search{position:relative;flex:1 1 220px;max-width:300px;min-width:160px}
#q{width:100%;box-sizing:border-box;cursor:text;padding:6px 9px}
#q::placeholder{color:var(--mist)}
#q:focus{outline:2px solid var(--sulfur);outline-offset:1px}
#qres{position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:min(60vh,420px);overflow:auto;z-index:5;padding:3px}
.qi{display:block;width:100%;text-align:left;background:none;border:0;color:var(--snow);padding:6px 8px;cursor:pointer;font-size:13px}
.qi b{display:block;font-weight:600}
.qi span{display:block;font-size:11px;color:var(--mist)}
.qi.on,.qi:hover{background:#1f3550}
.qe{padding:8px;color:var(--mist);font-size:13px}
.grp .btn+.btn{border-left:0}
.btn:hover{background:#1a2d40}
.btn.on{background:var(--lupine);color:var(--deep);border-color:var(--lupine)}
#insp{max-height:calc(100vh - 260px);overflow:auto;position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:270px;padding:10px 12px 12px;z-index:2}
#insp h3{font-weight:600;font-size:16px;margin:0;line-height:1.2;text-wrap:balance}
#insp .sub{color:var(--mist);font-size:12px;margin:3px 0 8px}
#insp .act{margin:8px 0 2px;padding:6px 8px;background:#14263a;border-left:3px solid var(--lupine);font-size:13px}
#insp .btn{margin-top:8px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-top:1px dashed #2a3f52}
.row span:first-child{color:var(--mist);flex:0 0 auto}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.bar{height:6px;background:#22364a;margin-top:6px}
.bar i{display:block;height:100%;background:var(--lupine)}
.bar.low i{background:var(--ember)}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(960px,calc(100% - 24px));z-index:3}
#cats{display:flex;overflow-x:auto;border-bottom:2px solid var(--line);scrollbar-width:none}
.cat{flex:1 0 auto;font-weight:600;font-size:12.5px;padding:8px 12px;background:none;color:var(--mist);border:0;border-right:2px solid var(--line);cursor:pointer;text-transform:uppercase;letter-spacing:.09em}
.cat:last-child{border-right:0}
.cat:hover{color:var(--snow)}
.cat[aria-selected="true"]{color:var(--deep);background:var(--lupine)}
.cat kbd{font:inherit;opacity:.55;margin-left:4px}
#tools{display:flex;flex-wrap:wrap;gap:5px;padding:8px;max-height:104px;overflow-y:auto}
.tool{display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:500;font-size:14px;color:var(--snow);background:#152637;border:2px solid #22374a;padding:6px 10px;cursor:pointer;flex:0 0 auto}
.tool:hover{border-color:#3b5873}
.tool .sw{width:10px;height:10px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.35),0 0 0 1px var(--deep)}
.tool.on{border-color:var(--lupine);background:#271f45}
#foot{display:flex;justify-content:space-between;align-items:center;gap:6px 14px;padding:0 10px 9px;color:var(--mist);font-size:13px;flex-wrap:wrap}
#desc{min-width:0;flex:1 1 300px}
#brush{display:flex;align-items:center;gap:4px}
#brush button{min-width:34px;height:24px;background:#152637;border:2px solid #22374a;color:var(--snow);cursor:pointer;font-size:12px}
#brush button.on{border-color:var(--lupine);background:#271f45}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(158px + env(safe-area-inset-bottom,0px));padding:7px 14px;font-size:14px;z-index:4;pointer-events:none;white-space:nowrap;transition:opacity .25s}
#credit{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--mist);z-index:1;text-shadow:1px 1px 0 var(--deep)}
#credit a{color:var(--mist)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--fjord);z-index:10}
#loading .box{padding:22px 26px;min-width:min(380px,80vw)}
#loading h1{font-family:var(--f-display);font-size:30px;margin:0 0 6px}
#loading p{margin:0 0 14px;color:var(--mist)}
#loading .bar{height:10px}
#mobinfo{display:none}
#bMenu{display:none}
#sharebox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));padding:14px;z-index:9}
#sharecode{width:100%;box-sizing:border-box;background:#0a141d;color:var(--snow);border:2px solid var(--line);font:11px ui-monospace,monospace;resize:vertical;padding:6px;word-break:break-all}
@media (max-width:760px){
  /* phone: a slim top bar (name, clock, weather, menu) and a compact tool strip; everything else lives in the menu */
  #insp{display:none}
  #hud{gap:6px;grid-auto-flow:column;align-items:center;left:calc(10px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px))}
  .brand{font-size:17px}
  .brand small{display:none}
  #stats{grid-template-columns:auto auto}
  #stats .stat:nth-child(-n+4){display:none}
  .stat{padding:4px 8px}
  .stat b{font-size:12.5px}
  .stat span{display:none}
  #bMenu{display:block;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:6;min-width:44px;min-height:36px;font-size:16px;line-height:1;padding:6px 10px}
  #ctrl{display:none;top:calc(52px + env(safe-area-inset-top,0px))!important;left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));max-width:none;justify-content:flex-start;padding:10px;gap:8px;z-index:6;background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px var(--deep),0 6px 0 rgba(0,0,0,.3);max-height:calc(100% - 200px);overflow:auto}
  body.menu #ctrl{display:flex}
  #search{flex:1 1 100%;max-width:none}
  #goto{flex:1 1 100%;max-width:none}
  #season,#weather{max-width:none;flex:1 1 40%}
  .btn{font-size:13px;padding:8px 10px}
  #dock{width:calc(100% - 16px);bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .cat{font-size:11px;padding:7px 9px;letter-spacing:.05em}
  .cat kbd{display:none}
  #tools{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;padding:6px;scrollbar-width:none}
  #tools::-webkit-scrollbar{display:none}
  .tool{font-size:13px;padding:6px 9px}
  #desc{display:none}
  #foot{padding:0 8px 6px;font-size:12px}
  #mobinfo{display:block;color:var(--snow);flex:1 1 100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mobinfo:empty{display:none}
  #foot:not(:has(#mobinfo:not(:empty))):not(:has(#brush:not([hidden]))){display:none}
  #toast{bottom:calc(112px + env(safe-area-inset-bottom,0px));white-space:normal;max-width:calc(100% - 40px);text-align:center}
  #wanted{top:calc(52px + env(safe-area-inset-top,0px))}
  #credit{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#wanted{position:fixed;left:50%;transform:translateX(-50%);top:calc(118px + env(safe-area-inset-top,0px));padding:5px 14px 6px;z-index:5;text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:1px}
#wanted[hidden]{display:none}
#wanted .st{font-size:24px;letter-spacing:3px;color:#ffd23a;text-shadow:0 1px 0 #000}
#wanted .st i{font-style:normal;color:rgba(255,255,255,.18)}
#wanted .lb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
#banner{position:fixed;left:0;right:0;top:38%;z-index:6;text-align:center;pointer-events:none;transition:opacity .4s;display:flex;flex-direction:column;align-items:center;gap:6px}
#banner[hidden]{display:none}
#banner b{font:900 clamp(34px,8vw,76px)/1 var(--font,system-ui);letter-spacing:.06em;color:#f2f2f2;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.7)}
#banner span{font-size:15px;color:#fff;text-shadow:0 1px 2px #000}

/* iOS zooms the whole page when a text field under 16px gets focus; keep form fields at 16px on touch screens */
@media (pointer:coarse),(hover:none),(max-width:820px){input,select,textarea,#q{font-size:16px!important}}
</style>

</nav>

<script>
/* The ☰ menu on phones: opens and closes the control panel, and closes it again when you touch the map,
   the tool dock, a control button or a search result. */
(() => {
  const m = document.getElementById('bMenu'),
    set = o => {
      document.body.classList.toggle('menu', o);
      m.setAttribute('aria-expanded', o);
      m.textContent = o ? '✕' : '☰';
    };
  m.onclick = () => set(!document.body.classList.contains('menu'));
  document.getElementById('cv').addEventListener('pointerdown', () => set(false));
  document.getElementById('dock').addEventListener('pointerdown', () => set(false));
  document.getElementById('ctrl').addEventListener('click', e => {
    const t = e.target.closest('button');
    if (
      t &&
      t.closest('#ctrl') &&
      innerWidth <= 760 &&
      !t.closest('[aria-label="Simulation speed"],[aria-label="Rotate view"]') &&
      !t.matches('#bRebuild')
    )
      setTimeout(() => set(false), 150);
  });
  document.getElementById('qres').addEventListener('click', () => setTimeout(() => set(false), 150));
})();
</script>
<script>
(() => {
'use strict';
// ---- 00-core.js ----
/**
 * Core helpers
 *
 * The canvas, the random helpers and the hash used for every deterministic "random" choice (h32).
 *
 * Functions: h32
 * State and constants: $, cv, ctx, R, RM, PX, VW, VH, pickA
 */

const $ = s => document.querySelector(s);
const cv = $('#cv'),
  ctx = cv.getContext('2d', { alpha: false });
const R = Math.random,
  RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PX = 2;
let VW = 0,
  VH = 0;
function h32(a, b, c) {
  let h = (a | 0) * 374761393 + (b | 0) * 668265263 + (c | 0) * 1442695041;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const pickA = a => a[(R() * a.length) | 0];

// ---- 01-view.js ----
/**
 * View rotation
 *
 * The eight view directions and the isometric projection: PXw/PYw turn world metres into screen x and
 * depth.
 *
 * Functions: setRot
 * State and constants: ROT, SXx, SXy, SYx, SYy, PXw, PYw
 */

// world: x east, y south (metres). Rotate by TH, then project isometrically.
let ROT = 7,
  SXx = 1,
  SXy = -1,
  SYx = 0.5,
  SYy = 0.5;
function setRot(r) {
  ROT = ((r % 8) + 8) % 8;
  const t = (ROT * Math.PI) / 4,
    c = Math.cos(t),
    s = Math.sin(t);
  SXx = c - s;
  SXy = -(s + c);
  SYx = (c + s) / 2;
  SYy = (c - s) / 2;
  if (Math.abs(SXx) < 1e-9) SXx = 0;
  if (Math.abs(SXy) < 1e-9) SXy = 0;
  if (Math.abs(SYx) < 1e-9) SYx = 0;
  if (Math.abs(SYy) < 1e-9) SYy = 0;
}
setRot(7);
const PXw = (x, y) => SXx * x + SXy * y,
  PYw = (x, y) => SYx * x + SYy * y; // depth == PYw

// ---- 02-world-data.js ----
/**
 * World data
 *
 * Land classes, their colours and names, and decoding of world.txt (terrain grids, buildings, road nodes)
 * into memory.
 *
 * Functions: mkGrid, load
 * State and constants: SEA, LAKE, GRASS, PARK, WOOD, SCRUB, SAND, WET, ROCK, PAVED, RUNWAY, PITCH, GOLF,
 *     CEM, PIER, RIVER, LAVA, RUBBLE, GLACIER, HIGH, URBAN, HAY, GCOL, GNAME, GEN, isWaterT, F, C, FN,
 *     STR, KX, KY, LAT0, LON0, PLACES, B, NX, NY, NODE_N, WAYS, TREES, NT, ll, DISTRICTS, DIST, GOTO,
 *     WALLS, ROOFS, APTW, COMW, INDW, PUBW, FLATR, AUT, CONC
 */

const SEA = 0,
  LAKE = 1,
  GRASS = 2,
  PARK = 3,
  WOOD = 4,
  SCRUB = 5,
  SAND = 6,
  WET = 7,
  ROCK = 8,
  PAVED = 9,
  RUNWAY = 10,

  GOLF = 12,

  LAVA = 16,

  URBAN = 20,

const GCOL = [

  [64, 118, 146],

  [88, 128, 70],
  [72, 104, 62],
  [120, 112, 78],
  [72, 70, 70],

  [255, 100, 30],
  [128, 116, 104],
  [226, 236, 242],
  [124, 116, 92],
  [150, 146, 136],
  [122, 158, 70]
];
const GNAME = [
  'Sjór',
  'Vatn',
  'Gras',
  'Garður',
  'Skógur',
  'Kjarr og lúpína',
  'Svartur sandur',
  'Mýri',
  'Hraun',
  'Malbik',
  'Flugbraut',
  'Íþróttavöllur',
  'Golfvöllur',

  'Glóandi hraun',
  'Rústir',

];
const GEN = [
  'Sea',
  'Lake',
  'Grass',
  'Park',
  'Woodland',
  'Scrub and lupine',
  'Black sand',
  'Wetland',
  'Lava field',

];
const isWaterT = t => t === SEA || t === LAKE || t === RIVER;
let F,
  C,

  STR,

  LAT0,
  LON0,
  PLACES = [];

const DISTRICTS = [
  ['Grandi', 64.153, -21.95],
  ['Miðborg', 64.1466, -21.9333],
  ['Vesturbær', 64.144, -21.962],

function obbOf(b) {
  if (b.obb) return b.obb;
  const P = b.poly,
    n = b.n;
  let best = null;
  for (let j = 0; j < n; j++) {
    const q = (j + 1) % n;
    let ux = P[2 * q] - P[2 * j],
      uy = P[2 * q + 1] - P[2 * j + 1];
    const L = Math.hypot(ux, uy);
    if (L < 0.5) continue;
    ux /= L;
    uy /= L;
    let u0 = 1e9,
      u1 = -1e9,
      v0 = 1e9,
      v1 = -1e9;
    for (let i = 0; i < n; i++) {
      const dx = P[2 * i] - b.cx,
        dy = P[2 * i + 1] - b.cy,
        u = dx * ux + dy * uy,
        v = -dx * uy + dy * ux;
      u0 = Math.min(u0, u);
      u1 = Math.max(u1, u);
      v0 = Math.min(v0, v);
      v1 = Math.max(v1, v);
    }
    const a = (u1 - u0) * (v1 - v0);
    if (!best || a < best.a) best = { a, ux, uy, u0, u1, v0, v1 };
  }
  if (!best) best = { a: 1, ux: 1, uy: 0, u0: -1, u1: 1, v0: -1, v1: 1 };
  // ridge runs along the long side
  if (best.v1 - best.v0 > best.u1 - best.u0 !== !!b.rx) {
    const o = best;
    best = { a: o.a, ux: -o.uy, uy: o.ux, u0: o.v0, u1: o.v1, v0: -o.u1, v1: -o.u0 };
  }
  best.rect = b.area / Math.max(1, best.a);
  best.hw = (best.v1 - best.v0) / 2;
  best.vm = (best.v0 + best.v1) / 2;
  best.L = best.u1 - best.u0;
  return (b.obb = best);
}

    maxy = -1e12;

    miny = Math.min(miny, P[j + 1]);
    maxy = Math.max(maxy, P[j + 1]);

    poly: P,
    n: P.length / 2,
    minx,
    maxx,
    miny,
    maxy,
    r: R + 0.5,
    h: PERLAN_TOP,
    obb: null

// Bónus: grey corrugated box, a big yellow sign box standing above the roof with black letters and the pink piggy-bank, yellow-framed glass porch
// Hagkaup: dark grey panelled facade, huge orange-red 3D letters, a full-height glass front
// Krónan: white facade with a long white canopy band, black letters with a yellow smiley for the Ó, glass shop front, yellow posters
// Nettó: dark green ribbed cladding, a tall slate sign tower with white lowercase "nettó", a strip of dark timber, red tomato

function frontEdge(b) {

    bd = 1e9;

      my = (P[2 * j + 1] + P[2 * q + 1]) / 2;

      ey = P[2 * q + 1] - P[2 * j + 1],
      l = L[j],
      ar = area2(P) > 0 ? 1 : -1,

      ny = (-ar * ex) / l;

      const wy = WAYS[w];

        c = wy.nodes[k + 1];

    n = b.n,
    ar = area2(P) > 0 ? 1 : -1,

    const q = (j + 1) % n,
      ex = P[2 * q] - P[2 * j],
      ey = P[2 * q + 1] - P[2 * j + 1],
      l = Math.hypot(ex, ey);

      ny = (-ar * ex) / l,
      mx = (P[2 * j] + P[2 * q]) / 2 + nx * 20,
      my = (P[2 * j + 1] + P[2 * q + 1]) / 2 + ny * 20;

    let d = 1e9;

      const wy = WAYS[w];

        c = wy.nodes[k + 1];

    ey = P[2 * q + 1] - P[2 * j + 1],
    l = Math.hypot(ex, ey),

  if (fs < 4) return null;

    (fl * (B2[0] - A[0])) / sw,
    (fl * (B2[1] - A[1])) / sw,
    0,
    1,
    (A[0] + B2[0] + C2[0] + D[0]) / 4,
    (A[1] + B2[1] + C2[1] + D[1]) / 4

    fs,
    w,
    fl,
    m: [
      (fl * (B2[0] - A[0])) / sw,
      (fl * (B2[1] - A[1])) / sw,
      (A[0] + B2[0] + C2[0] + D[0]) / 4,

/* ================= hills in front of things =================
   Buildings, trees, people and animals are drawn after the ground, so a hill between them and the camera would not
   hide them. hillLine follows the line of sight from a point on the ground towards the viewer (screen x fixed,
   rising one metre for every metre of depth) and returns the highest screen row the ground in front of it reaches,
   in the same units as PYw − z. Whatever is drawn at that point below that row is behind the hill.
   The search stops once it is past the highest ground in the area, so on flat land it costs a few height samples. */

    per = HLB / C.CS;

    i1 = Math.min(bw - 1, Math.floor((Math.max(x0, x1) - C.OX) / HLB)),

function hillPt(o, x, y, z, hgt, frames) {

          for (const [ox, oy] of [

/**

   Lifts stand all year; in the season (December–April, 10:00 to 21:00 on weekdays, to 17:00 at weekends) chairs and T-bars run and

  platter: 3.4,
  rope_tow: 1,
  magic_carpet: 0.3,
  zip_line: 10

/**

/* ================= domestic flights across the country =================
   Each departure from Reykjavík climbs out locally and then crosses the island at cruise height to its destination;
   arrivals cross back and hand over to the approach. Flights keep to their timetable, but fly at real cruise speed while on screen (see stepCruise). */

  'Akureyri': [65.66, -18.0727, 45],

  'Höfn': [64.2956, -15.2272, 55],
  'Bíldudalur': [65.6413, -23.5462, 45],
  'Gjögur': [65.9953, -21.3269, 50],

        plane: 1,
        cruise: 1,
        t0: day * 1440 + e.t - dur + 6,
        t1: day * 1440 + e.t - 1,
        arr: 1,
        a: far,
        b: near,
        t: e.type,
        airline: e.al,
        liv: [150, 154, 160],

    buildCruise(day);

function terrainTool(id, x, y, r, first) {

        const t = gT(c);

      });

    case 'forest':
      cellsIn(x, y, r, c => {
        const t = gT(c);
        if (!isWaterT(t) && t !== LAVA && t !== GLACIER) setCell(c, WOOD, undefined, 1);
      });

          ty = y + (R() - 0.5) * 2 * r;

function stepPlay(dt) {

        a.y = ny;
      } else if (!blockedAt(nx, a.y)) a.x = nx;

      }

      a.vy = d[1] * sp;

        if (CTRL.rev > 0.5) s -= dt * 5;

      const f1 = [Math.cos(hd), Math.sin(hd)];
      const sc1 = [f1[0] * SXx + f1[1] * SXy, f1[0] * SYx + f1[1] * SYy];
      const ang = Math.atan2(sc1[1], sc1[0]) + turn;

      hd = Math.atan2(w[1], w[0]);

        }

      if ((a.dmg || 0) > 80 && R() < dt * 3) smoke(a.x, a.y, hAt(a.x, a.y) + 1.2, true, 1, 2.2);

        }
        a.ctrl = 0;
        a.keep = 1;

        a.wrT = 80;

    a.sp = Math.abs(s);
    a.vx = Math.cos(hd) * s;
    a.vy = Math.sin(hd) * s;
    a.ldx = Math.cos(hd);
    a.ldy = Math.sin(hd);
    if (s < 0) {
      a.vx = -a.vx;
      a.vy = -a.vy;
    }
    if (Math.abs(s) < 0.05) {

    }

    const p = a,
      T = PTYPE[p.t];

        follow = null;
        return;

    {
      let bh = false;
      nearB(p.x, p.y, 60, b => {

  }

  for (const b of B) {
    if (b.state !== 0) continue;
    nb++;
    p += b.res;
  }
  pop = Math.round(p * POPF);
  statsDirty = false;
}
function tick(dt) {
  tickN++;
  gameMin += dt * 2;
  if (tickN % 20 === 0)
    try {
      checkShut();
    } catch (e) {}
  try {
    stepSki(dt);
    stepViewpoints(dt);
    stepGC(dt);
    stepFerryCars(dt);
  } catch (e) {
    console.warn(e);
  }
  try {
    stepLots(dt);
  } catch (e) {
    console.warn(e);
  }
  stepWeather(dt, dt * 2);
  for (const b of burning) {
    b.hp -= (dt * 3) / (1 + b.area / 600);
    b.fire += dt;
    const spreads = !b.fgen; // only a fire that was started spreads, and only to what touches it
    if (spreads && b.fire > 4 && R() < dt * 0.3 && b.nb)
      for (const o of b.nb) if (o.state === 0 && o.fire <= 0 && R() < 0.12) ignite(o, 1);
    if (spreads && R() < dt * 0.6)
      nearT(b.cx, b.cy, b.r + 10, t => {
        if (R() < 0.3) igniteTree(t, 1);
      });
    if (R() < 0.0008 || (rainT > 0 && R() < 0.04) || flood > b.z) b.fire = 0;
    if (R() < dt * 1.6) smoke(b.cx, b.cy, b.z + b.base + b.h, true, 1, Math.min(14, 4 + b.r / 3));
    if (b.fire <= 0) {
      burning.delete(b);
      dirtyB(b);
      trucksBusy.delete(b);
    }
    if (b.hp <= 0) destroyB(b, false);
  }
  for (const t of burningT) {
    TREES.f[t] += dt;
    // a wildfire you started runs from tree to tree and can catch the houses beside it; a tree that caught from a
    // burning house just burns
    const tg = TFGEN.get(t) || 0;
    if (!tg && R() < dt * 0.5)
      nearT(TREES.x[t], TREES.y[t], 12, u => {
        if (R() < 0.4) igniteTree(u, 0);
      });
    if (!tg && R() < dt * 0.6)
      nearB(TREES.x[t], TREES.y[t], 20, b => {
        if (Math.hypot(b.cx - TREES.x[t], b.cy - TREES.y[t]) < b.r + 6 && R() < 0.2) ignite(b, 1);
      });
    if (R() < dt * 2) smoke(TREES.x[t], TREES.y[t], hAt(TREES.x[t], TREES.y[t]) + 6, true, 1, 2);
    if (TREES.f[t] > 6 + R() * 6 || (rainT > 0 && R() < 0.05)) {
      TREES.s[t] = 2;
      burningT.delete(t);
      TFGEN.delete(t);
      dirtyWorld(TREES.x[t], TREES.y[t], false, true);
    }
  }
  if (quake) {
    quake.t -= dt;
    shake = Math.max(shake, 1);
    for (let q = 0; q < 10; q++) {
      const x = quake.x + (R() - 0.5) * 1800,
        y = quake.y + (R() - 0.5) * 1800;
      const c = cellAt(x, y);
      if (c < 0) continue;
      let hit = null;
      nearB(x, y, 40, b => {
        if (!hit && b.state === 0) hit = b;
      });
      if (hit) {
        const b = hit;
        b.hp -= b.sp ? 3 : 12 + R() * 18;
        dust(b.cx, b.cy, b.z, 2, b.r);
        if (b.hp <= 0) destroyB(b, false, !b.name);
        else if (R() < 0.04) ignite(b);
        else if (b.hp < 50) dirtyB(b);
      } else if (!isWaterT(gT(c)) && gT(c) !== LAVA && R() < 0.3)
        setCell(c, ROCK, gH(c) - (R() < 0.5 ? 1 : 0), 1);
    }
    if (quake.t <= 0) quake = null;
  }
  if (floodT > 0) {
    floodT += dt;
    const t = floodT;
    flood = t < 4 ? 7 * (t / 4) : t < 10 ? 7 : t < 15 ? 7 * (1 - (t - 10) / 5) : 0;
    if (t >= 15) {
      floodT = 0;
      flood = 0;
    }
    if (tickN % 5 === 0)
      for (const a of agents)
        if (!a.dead && !a.car && hAt(a.x, a.y) < flood - 0.3 && !a.flee)
          flee(a, { x: a.x - 50, y: a.y - 50, r: 60 });
    if (tickN % 3 === 0) {
      const vr = viewRect(200);
      eachB(BBUCK, vr[0], vr[1], vr[2], vr[3], b => {
        if (b.state === 0 && !b.sp && b.z < flood - 0.5) {
          b.hp -= 6;
          if (b.hp <= 0) destroyB(b, false, true);
        }
      });
    }
  }
  if (rainT > 0) rainT -= dt;
  stepLava(dt);
  stepVolc(dt);
  stepRebuild(dt);
  if (tickN % 5 === 0)
    for (const a of agents) {
      if (a.dead) continue;
      const c = cellAt(a.x, a.y);
      if (c < 0) continue;
      if (gT(c) === LAVA || (flood > hAt(a.x, a.y) + 1 && !a.car)) killA(a);
    }
  if (tickN % 20 === 0) recalc();
}

    ad = 1e9;

    if (a.dead) continue;
    const s = sp_(a.x, a.y, hAt(a.x, a.y) + (a.car ? 1 : 1.4));
    const d = Math.hypot(s[0] - px, s[1] - py);

      const s = sp_(g.x, g.y, gz(g) + (g.k === 'fall' ? g.H * 0.5 : 1));
      const d = Math.hypot(s[0] - px, s[1] - py);

        d <
          Math.max(
            8,
            K * (g.k === 'fall' ? Math.max(g.W, g.H) * 0.5 : g.k === 'plant' ? 60 : (g.pool || 2) * 1.5)

    if (d < Math.max(6, K * PTYPE[p.t].L * 0.4) && d < ad) {
      ad = d;
      bestA = p;
    }

    if (a.dead) continue;
    const s = sp_(a.x, a.y, (a.fly ? a.z : hAt(a.x, a.y)) + (a.sp === 'horse' || a.sp === 'cow' ? 1 : 0.5));
    const d = Math.hypot(s[0] - px, s[1] - py);

      sb.push(d - z0 * K);

    const inP = ys => {
      let ins = false;
      for (let i = 0, j = n - 1; i < n; j = i++) {

    };

      for (let j = 0; j < n; j++) {
        const q = (j + 1) % n;
        if ((sx[j] - px) * (sx[q] - px) <= 0) {

/**
 * Main loop and start-up
 *
 * The animation frame loop and the start-up sequence that loads all data.
 *
 * Functions: frame, placeInsp
 * State and constants: last, uiAcc, behAcc, spawnAcc, READY
 */

let last = performance.now(),
  uiAcc = 0,
  behAcc = 0,
  spawnAcc = 0,
  READY = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  if (READY) perfStep(now - last);
  last = now;
  time += dt;
  if (CTRL) stepPlay(dt);
  stepCrime(dt);
  const ps = CTRL ? 0 : (420 * dt) / PX;
  if (keys.has('arrowleft') || keys.has('a')) camX -= ps;
  if (keys.has('arrowright') || keys.has('d')) camX += ps;
  if (keys.has('arrowup') || keys.has('w')) camY -= ps;
  if (keys.has('arrowdown') || keys.has('s')) camY += ps;
  if (keys.size) {
    camX = Math.round(camX);
    camY = Math.round(camY);
    clampCam();
  }
  if (follow && !follow.dead) {
    const z = follow.fly ? follow.z : hAt(follow.x, follow.y);
    const tx = PXw(follow.x, follow.y) * K - VW / 2,
      ty = (PYw(follow.x, follow.y) - z) * K - VH / 2;
    camX = Math.round(camX + (tx - camX) * Math.min(1, dt * 4));
    camY = Math.round(camY + (ty - camY) * Math.min(1, dt * 4));
  }
  simAcc += dt * speed;
  let n = 0;
  while (simAcc >= 0.1 && n < 8) {
    tick(0.1);
    simAcc -= 0.1;
    n++;
  }
  if (n >= 8) simAcc = 0;
  if (speed > 0) {
    stepAgents(dt * Math.min(speed, 2));
    stepAnimals(dt * Math.min(speed, 2));
    behAcc += dt * speed;
    if (behAcc > 0.25) {
      behAcc = 0;
      behave();
    }
    spawnAcc += dt;
    if (spawnAcc > 0.4) {
      spawnAcc = 0;
      spawnTick();
    }
  }
  stepParts(dt * (speed ? Math.min(2, speed) : 1));
  shake = Math.max(0, shake - dt * 1.2);
  zoomStep(dt);
  stepAreaFX(dt);
  stepEnts(dt * Math.min(speed, 2));
  stepPlanes(dt * Math.max(speed, 0.0001) * (speed ? 1 : 0));
  try {
    stepBoats(dt * (speed ? Math.min(speed, 2) : 0));
    stepGeo(dt * (speed ? Math.min(speed, 2) : 0));
    stepEvents(dt * (speed ? Math.min(speed, 2) : 0));
  } catch (e) {
    console.warn(e);
  }
  lighting();
  if (!ZM || ZM.dirty || LEVELS[ZM.tgt] <= K) {
    const _t = performance.now(),
      _e = window.__ens || 0,
      _f = window.__tfb || 0;
    draw();
    const _d = performance.now() - _t;
    if (_d > 45)
      (window.__slow = window.__slow || []).push([
        _d | 0,
        ((window.__ens || 0) - _e) | 0,
        ((window.__tfb || 0) - _f) | 0,
        K,
        !!ZM
      ]);

  } else if (LEVELS[ZM.tgt] > K) prefetchLevel(ZM.tgt, 11);
  {
    const used = performance.now() - now;
    if (used < 9) prefetchPan(Math.min(6, 11 - used));
  }

    updUI();
  }

}

    $('#ldtxt').textContent = 'Could not load the map data: ' + e.message;
  });
})();
</script>
