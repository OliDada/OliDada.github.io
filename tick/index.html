<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tick</title>
<link rel="icon" href="/images/logo-favicon.png?v=4" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="hl"><a class="back" href="/daily.html" target="_top" aria-label="Back to daily games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><div class="logo">TICK<i>.</i> <span id="dayNo"></span></div></div>
    <div class="hr"><div class="dots" id="dots"></div><button class="mute" id="mute" aria-label="Sound on"></button></div>
  </header>

  <div id="play" class="col">
    <div class="qcard">
      <div class="qtext">
        <div class="qtop"><span id="kind"></span><span id="count"></span></div>
        <h1 id="question"></h1>
      </div>
    </div>

    <div class="stage">
      <div class="dial" id="dial">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="shadow" cx="100" cy="105" r="94"/>
          <circle class="face" cx="100" cy="100" r="94"/>
          <g id="ticks"></g>
          <line class="hand" id="hand" x1="100" y1="100" x2="100" y2="26"/>
          <circle class="hub" cx="100" cy="100" r="8"/>
        </svg>
        <div class="digits" id="digits" aria-live="off"></div>
      </div>
      <div class="note" id="note"></div>
      <div class="cmp" id="cmp"><div><b id="cTarget"></b><span>target</span></div><div><b id="cYou"></b><span>you</span></div></div>
    </div>

    <button class="btn" id="go">Start the clock</button>

    <div class="result" id="result">
      <div class="vrow"><div class="pill" id="pill"></div><div class="vtxt" id="vtxt"></div></div>
      <button class="btn" id="next">Next</button>
    </div>
  </div>

  <div class="end" id="end">
    <div class="sub">Tick <span id="endDay"></span> · today's score</div>
    <div class="big" id="total"></div>
    <div class="rcard" id="rcard"></div>
    <button class="btn" id="share">Share result</button>
    <div class="stats" id="stats"></div>
    <div class="countdown">Next set in <b id="countdown"></b></div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
