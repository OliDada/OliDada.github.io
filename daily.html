<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" href="images/logo-favicon.png?v=2" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/site.webmanifest?v=2">
    <meta name="apple-mobile-web-app-title" content="OliD.is">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffa500">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Baloo+2:wght@600;700;800&family=Bungee&family=Comic+Neue:wght@700&family=Nunito:wght@500;600;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
    <link href="site.css" rel="stylesheet">
    <link href="bit.css" rel="stylesheet">
    <script src="script.js" defer></script>
    <script src="site.js" defer></script>
    <script src="bit.js?v=20261113" defer></script>
    <title>OliD.is – Daily games</title>
  </head>
  <body>
    <canvas id="three-canvas" class="three-canvas" aria-hidden="true"></canvas>
    <div class="wrap">
      <header class="site-header">
        <a class="brand" href="/">
          <img src="images/logo.svg" alt="">
          <span>
            <span class="brand-name disp">OliD.is</span>
            <span class="brand-tag">Games and stuff</span>
          </span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <a class="btn" href="/">Games</a>
          <a class="btn" href="/jokes.html">Jokes</a>
          <a class="btn" href="/daily.html" aria-current="page">Daily</a>
          <button type="button" id="customiseBtn" class="btn btn-yellow" aria-expanded="false" aria-controls="customise">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7.5" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
            <span class="btn-label">Customise</span>
          </button>
        </nav>
      </header>

      <main style="display:flex;flex-direction:column;gap:36px">
        <section class="hero">
          <h1 class="disp">Daily games</h1>
          <p>Come back every day for a new challenge!</p>
        </section>

        <section class="daily-grid" aria-label="Daily games">
          <a class="dg-card stk dg-big" href="/slice/index.html">
            <img src="data/thumbnails/slice-thumbnail.png" alt="">
            <span class="dg-body">
              <span class="dg-text"><span class="dg-title disp">Slice</span><span class="dg-line">One cut per shape. Get it exactly in half.</span></span>
              <span class="dg-play" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>
            </span>
          </a>
          <a class="dg-card stk" href="/pinpoint/index.html">
            <img src="data/thumbnails/pinpoint-thumbnail.png" alt="">
            <span class="dg-body">
              <span class="dg-text"><span class="dg-title disp">Pinpoint</span><span class="dg-line">Pin each shape at its balance point.</span></span>
              <span class="dg-play" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>
            </span>
          </a>
          <a class="dg-card stk" href="/magnitude/index.html">
            <img src="data/thumbnails/magnitude-thumbnail.png" alt="">
            <span class="dg-body">
              <span class="dg-text"><span class="dg-title disp">Magnitude</span><span class="dg-line">How big? How many? Guess the number.</span></span>
              <span class="dg-play" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>
            </span>
          </a>
        </section>
      </main>
    </div>
  </body>
</html>
