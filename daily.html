    <style>
      /* Daily page: each game is its thumbnail with a slim strip underneath showing today's squares, score and streak. */
      .dg-hero p { font-size: 18px; }
      .dg-done { display: inline-block; margin-left: 6px; padding: 2px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--cream); font-size: 14px; vertical-align: 2px; }
      .dg-done:empty { display: none; }
      .daily-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
      .dg-body { flex: none; display: block; padding: 7px 12px; background: var(--g, var(--cream)); }
      .dg-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .dg-btn { font-weight: 800; font-size: 14px; line-height: 1.2; white-space: nowrap; }
      .dg-card:not(.is-going):not(.is-done) .dg-btn { opacity: .6; }
      .dg-sq { display: flex; gap: 4px; order: -1; }
      .dg-sq i { width: 13px; height: 13px; border-radius: 4px; border: 2px solid var(--ink); background: transparent; }
      .dg-sep { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin: 2px 0 -4px; font-weight: 800; font-size: 13px; opacity: .55; }
      .dg-sep::before, .dg-sep::after { content: ""; flex: 1; border-top: 2px dashed currentColor; }
      .dg-sq i.g { background: #2FB36D; } .dg-sq i.y { background: #F2B33D; } .dg-sq i.o { background: #F28A3D; } .dg-sq i.r { background: #F0563E; }
      @media (max-width: 1100px) { .daily-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (max-width: 860px) { .daily-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 620px) { .daily-grid { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
    </style>
    <title>OliD.is – Daily games</title>
  </head>

    <div class="wrap">

        <a class="brand" href="/">
          <img src="images/logo.svg" alt="">
          <span>
            <span class="brand-name disp">OliD.is</span>
            <span class="brand-tag">Games and stuff</span>
          </span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <a class="btn" href="/">Games</a>
          <a class="btn" href="/jokes.html">Jokes</a>
          <a class="btn" href="/daily.html" aria-current="page">Daily</a>
          <button type="button" id="customiseBtn" class="btn btn-yellow" aria-expanded="false" aria-controls="customise">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7.5" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
            <span class="btn-label">Customise</span>
          </button>
        </nav>
      </header>

      <main style="display:flex;flex-direction:column;gap:28px">
        <section class="hero dg-hero">
          <h1 class="disp">Daily games</h1>
          <p><span id="dgDate">New puzzles every day.</span> <span id="dgDone" class="dg-done"></span></p>
        </section>
        <section class="daily-grid" aria-label="Daily games">
          <a class="dg-card stk" style="--g:#FFD93D" aria-label="Slice. One cut per shape. Get it exactly in half." href="/slice/index.html" data-key="slice:v1" data-field="cuts" data-launch="12">
            <img src="data/thumbnails/slice-thumbnail.png" alt="">
            <span class="dg-body">
              <span class="dg-foot"><span class="dg-btn">Play</span><span class="dg-sq" aria-hidden="true"></span></span>
            </span>
          </a>
          <a class="dg-card stk" style="--g:#C77DFF" aria-label="Mix. Match the colour, one drop at a time." href="/mix/index.html" data-key="mix:v1" data-field="res" data-launch="12">
            <img src="data/thumbnails/mix-thumbnail.png" alt="">
            <span class="dg-body">
              <span class="dg-foot"><span class="dg-btn">Play</span><span class="dg-sq" aria-hidden="true"></span></span>
            </span>
          </a>
          <a class="dg-card stk" style="--g:#FF7A6B" aria-label="Peek. Poke holes in the cover. Name the picture in as few peeks as you can." href="/peek/index.html" data-key="peek:v1" data-field="res" data-launch="13" data-rounds="3">
            <img src="data/thumbnails/peek-thumbnail.png" alt="">
            <span class="dg-body">
              <span class="dg-foot"><span class="dg-btn">Play</span><span class="dg-sq" aria-hidden="true"></span></span>
            </span>
          </a>
          <a class="dg-card stk" style="--g:#5BB0FF" aria-label="Whereabouts. Five places. Drop a pin on the globe." href="/whereabouts/index.html" data-key="whereabouts:v1" data-field="res" data-launch="13">
            <img src="data/thumbnails/whereabouts-thumbnail.png" alt="">
            <span class="dg-body">
              <span class="dg-foot"><span class="dg-btn">Play</span><span class="dg-sq" aria-hidden="true"></span></span>
            </span>
          </a>
          <a class="dg-card stk" style="--g:#FF9F43" aria-label="Rank. Five things. Put them in order." href="/rank/index.html" data-key="rank:v1" data-field="tries" data-launch="13">
            <img src="data/thumbnails/rank-thumbnail.png" alt="">
            <span class="dg-body">
              <span class="dg-foot"><span class="dg-btn">Play</span><span class="dg-sq" aria-hidden="true"></span></span>
            </span>
          </a>
          <a class="dg-card stk" style="--g:#FF7EC7" aria-label="Swap. Four hidden groups. Swap the words into the right rows." href="/swap/index.html" data-key="swap:v1" data-field="res" data-launch="13" data-rounds="4" data-kind="swap">
            <img src="data/thumbnails/swap-thumbnail.png" alt="">

            <img src="data/thumbnails/tick-thumbnail.png" alt="">

            </span>
          </a>

            <img src="data/thumbnails/flood-thumbnail.png" alt="">

            </span>
          </a>
          <a class="dg-card stk" style="--g:#E8C48A" aria-label="Flip. Flip tiles to clear the board." href="/flip/index.html" data-key="flip:v1" data-field="res" data-launch="13" data-rounds="1" data-kind="par" data-unit="taps">
            <img src="data/thumbnails/flip-thumbnail.png" alt="">

            </span>
          </a>
          <a class="dg-card stk" style="--g:#8A8FFF" aria-label="Ballpark. How big? How many? Guess the number." href="/ballpark/index.html" data-key="magnitude:v3" data-field="res" data-launch="12">
            <img src="data/thumbnails/ballpark-thumbnail.png" alt="">
            <span class="dg-body">
              <span class="dg-foot"><span class="dg-btn">Play</span><span class="dg-sq" aria-hidden="true"></span></span>
            </span>
          </a>
          <a class="dg-card stk" style="--g:#FF6F91" aria-label="Twins. Split each shape into two identical pieces." href="/twins/index.html" data-key="twins:v1" data-field="res" data-launch="13" data-rounds="3" data-kind="time">
            <img src="data/thumbnails/twins-thumbnail.png" alt="">
            <span class="dg-body">
              <span class="dg-foot"><span class="dg-btn">Play</span><span class="dg-sq" aria-hidden="true"></span></span>
            </span>
          </a>
          <a class="dg-card stk" style="--g:#F0A8FF" aria-label="Trace. See a shape for three seconds. Draw it from memory." href="/trace/index.html" data-key="trace:v3" data-field="res" data-launch="13">
            <img src="data/thumbnails/trace-thumbnail.png" alt="">
            <span class="dg-body">

        </section>
      </main>
    </div>
    <script>
      // Fill in today's date and, for each game, today's squares, score and streak from what the games saved on this device.
      (() => {
        const now = new Date(), day = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5;
        document.getElementById('dgDate').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) + '.';
        const cards = [...document.querySelectorAll('.dg-card')]; let done = 0;
        for (const c of cards) {
          const field = c.dataset.field, rank = field === 'tries', rounds = +(c.dataset.rounds || 5), swap = c.dataset.kind === 'swap';
          let days = {}, no = 0;
          try { no = day - Date.UTC(2026, 10, +c.dataset.launch) / 864e5 + 1; days = (JSON.parse(localStorage.getItem(c.dataset.key)) || {}).days || {}; } catch (e) {}
          const get = d => (days[d] || {})[field] || [];
          const last = t => t[t.length - 1] || [];
          // Rank is one puzzle with two tries; the others have data-rounds rounds (five unless the card says)
          const finished = r => rank ? r.length >= 2 || (r.length > 0 && last(r).every(Boolean)) : r.filter(Boolean).length >= rounds;
          const res = get(no), n = res.filter(Boolean).length, fin = finished(res);
          const marks = rank ? last(res).map(ok => ok ? 'g' : 'r') : res.map(r => r && r.c || '');
          let streak = 0; for (let d = no; d > 0; d--) { if (finished(get(d))) streak++; else if (d === no) continue; else break; }
          let score = '';
          if (fin) {
            if (rank) score = `${last(res).every(Boolean) ? res.length : 'X'}/2 tries`;
            else if (c.dataset.kind === 'par') { const d = days[no] || {}; score = `${d.moves} ${c.dataset.unit}${d.moves <= d.par ? ' · par' : ''}`; }
            else if (c.dataset.kind === 'time') { const sec = Math.floor(res.reduce((t, r) => t + (r.c === 'r' ? 0 : r.ms), 0) / 1000), shown = res.filter(r => r.c === 'r').length; score = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') + (shown ? ` · ${rounds - shown}/${rounds}` : ''); }
            else if (swap) { const sw = (days[no] || {}).swaps || 0; score = `${sw} ${sw === 1 ? 'swap' : 'swaps'}`; }
            else if (field === 'cuts') score = (Math.round(res.reduce((a, r) => a + (100 - 2 * (50 - r.small)), 0) / res.length * 10) / 10).toFixed(1) + '%';
            else score = `${res.reduce((a, r) => a + (r.pts || 0), 0)}/${rounds * 100}`;
          }
          c.querySelector('.dg-sq').innerHTML = Array.from({ length: rounds }, (_, i) => `<i class="${marks[i] || ''}"></i>`).join('');
          const btn = c.querySelector('.dg-btn'), fire = streak > 1 ? ` · ${streak}-day streak` : '';
          if (fin) { done++; c.classList.add('is-done'); btn.textContent = score + fire; }
          else if (n > 0) { c.classList.add('is-going'); btn.textContent = `${n}/${rank ? 2 : rounds} done` + fire; }
          else btn.textContent = 'Not played' + fire;
        }
        // Games already finished today move to the end, keeping their order.
        const grid = document.querySelector('.daily-grid');
        const played = cards.filter(c => c.classList.contains('is-done'));
        if (played.length && played.length < cards.length) {   // a quiet divider before the finished ones
          const sep = document.createElement('div'); sep.className = 'dg-sep'; sep.innerHTML = '<span>Played today</span>'; grid.appendChild(sep);
        }
        played.forEach(c => grid.appendChild(c));
        document.getElementById('dgDone').textContent = `${done} of ${cards.length} played`;
      })();
    </script>
  </body>
