<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flood</title>
<link rel="icon" href="/images/logo-favicon.png?v=3" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="hl"><a class="back" href="/daily.html" target="_top" aria-label="Back to daily games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><div class="logo">FLOOD<i>.</i> <span id="dayNo"></span></div></div>
    <div class="hr"><button class="mute" id="mute" aria-label="Sound on"></button></div>
  </header>

  <div id="play" class="col">
    <p class="rule">Flood the board from the top-left corner.</p>
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
    <div class="pal" id="pal"></div>
    <div class="bar"><div class="meter"><span>Moves</span><b id="moves">0</b></div><div class="meter"><span>Par</span><b id="par">–</b></div></div>
    
  </div>

  <div class="end" id="end">
    <div class="sub">Flood <span id="endDay"></span></div>
    <div class="big" id="total"></div>
    <div class="verdict" id="verdict"></div>
    <button class="btn" id="share">Share result</button>
    <div class="stats" id="stats"></div>
    <div class="countdown">Next in <b id="countdown"></b></div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
