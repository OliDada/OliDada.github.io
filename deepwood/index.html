<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Deepwood</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #16261f; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: ui-rounded, 'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif; color: #1d1a2b; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; color: #fff; text-shadow: 0 2px 0 rgba(29, 26, 43, .55); font-weight: 800; }
    #dist { font-size: 34px; line-height: 1; }
    #dist small { font-size: 16px; margin-left: 3px; }
    #best { font-size: 15px; text-align: right; }
    #panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; pointer-events: none; }
    #panel[hidden] { display: none; }
    .box { background: #fffaf0; border: 3px solid #1d1a2b; border-radius: 22px; box-shadow: 6px 6px 0 #1d1a2b; padding: 20px 28px; text-align: center; }
    .box p { margin: 4px 0; font-size: 17px; font-weight: 700; }
    .box .big { font-size: 44px; font-weight: 900; line-height: 1.1; }
    .box .go { display: inline-block; margin-top: 10px; background: #ff6fb1; border: 3px solid #1d1a2b; border-radius: 999px; box-shadow: 3px 3px 0 #1d1a2b; padding: 8px 20px; font-size: 18px; font-weight: 900; }
    #hop { position: fixed; right: 18px; bottom: max(22px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%; border: 3px solid #1d1a2b; background: rgba(255, 225, 77, .92); box-shadow: 4px 4px 0 #1d1a2b; font: inherit; font-size: 20px; font-weight: 900; color: #1d1a2b; display: none; }
    @media (pointer: coarse) { #hop { display: block; } }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js" } }</script>
  <script type="module" src="/music/game-music.js" data-slot="gravity-dash" data-song="/music/songs/gravity-dash-downhill.json"></script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><div id="dist">0<small>m</small></div><div id="best"></div></div>
  <div id="panel" hidden><div class="box" id="box"></div></div>
  <button id="hop" type="button" aria-label="Hop">HOP</button>
  <script type="module" src="game.js?v=11"></script>
</body>
</html>
