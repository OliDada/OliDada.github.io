<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Trace</title>
<link rel="icon" href="/images/logo-favicon.png?v=4" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="hl"><a class="back" href="/daily.html" target="_top" aria-label="Back to daily games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><div class="logo">TRACE<i>.</i> <span id="dayNo"></span></div></div>
    <div class="hr"><div class="dots" id="dots"></div><button class="mute" id="mute" aria-label="Sound on"></button></div>
  </header>

  <div id="play" class="col">
    <div class="qcard">
      <div class="qtop"><span id="count"></span><span id="kind"></span></div>
      <h1 id="name"></h1>
    </div>

    <div class="board" id="board">
      <canvas id="cv"></canvas>
      <div class="timer" id="timer"><i id="bar"></i></div>
      <div class="cover" id="cover"><span id="coverTxt"></span></div>
      <div class="score" id="score"></div>
    </div>

    <div class="row" id="controls">
      <button class="nudge" id="redo" aria-label="Start again"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
      <button class="btn" id="go">Show me</button>
    </div>

    <div class="result" id="result">
      <div class="vrow"><div class="pill" id="pill"></div><div class="vtxt" id="vtxt"></div></div>
      <button class="btn" id="next">Next</button>
    </div>
  </div>

  <div class="end" id="end">
    <div class="sub">Trace <span id="endDay"></span> · today's score</div>
    <div class="big" id="total"></div>
    <div class="tiles" id="tiles"></div>
    <button class="btn" id="share">Share result</button>
    <div class="stats" id="stats"></div>
    <div class="countdown">Next set in <b id="countdown"></b></div>
    <div class="credit">Some shapes from game-icons.net (CC BY 3.0). Maps from Natural Earth.</div>
  </div>
</div>
<script src="shapes.js"></script>
<script src="game.js"></script>
</body>
</html>
