<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pip's desktop · olid.is</title>
  <link rel="icon" href="/images/dolphin2.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Comic+Neue:wght@700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="/bit.css" rel="stylesheet">
  <style>
    /* /pip: Pip's desktop. A page Pip made himself; Oli doesn't know it exists. Pip set up
       his own little computer: apps for the switches that run the front page, Oli's hidden games, a game
       Pip made, Oli's notes, Pip's things, and the locked way out. On a phone it's a home screen and each
       app opens full screen. Pip's chat is always open here (bit.js docks it, see bit.css). */
    :root { --ink: #1d1a2b; --cream: #fffaf0; --purple: #3b1d7a; --lilac: #d5c2ff; --accent: #6d3fd6; --soft: #6b6585; --line: #e2dcef; --yellow: #ffe14d; --pink: #ff9bc7; --blue: #9be7ff; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--purple); color: var(--ink); font: 700 15px/1.45 'Nunito', system-ui, sans-serif; overflow: hidden; }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 72% 22%, rgba(255,111,177,.2), transparent 55%), radial-gradient(ellipse at 18% 92%, rgba(56,182,255,.16), transparent 50%); }
    /* (no wallpaper: Pip's face is the desktop now) */
    button { font: inherit; color: inherit; }
    a { color: var(--accent); }

    /* ---- top bar */
    .bar { position: fixed; left: 0; right: 0; top: 0; height: 44px; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: rgba(20, 10, 45, .6); color: var(--cream); font-weight: 800; font-size: 14px; }
    .bar .f { width: 26px; height: 26px; flex: none; }
    .bar .f svg { width: 100%; height: 100%; overflow: visible; }
    .bar .sub { flex: 1; opacity: .7; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .bar a { color: var(--cream); text-decoration: none; border: 2px solid rgba(255,250,240,.35); border-radius: 999px; padding: 3px 11px; white-space: nowrap; }
    .bar a:hover { border-color: var(--cream); }

    /* ---- desktop icons */
    .desk { position: fixed; left: 0; top: 44px; bottom: 0; overflow: auto; padding: 22px 20px; display: grid; grid-template-columns: repeat(2, 104px); grid-auto-rows: max-content; gap: 16px 8px; align-content: start; z-index: 1; }
    .app { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--cream); font-weight: 800; font-size: 13px; line-height: 1.15; text-align: center; padding: 4px; border-radius: 14px; }
    .app i { width: 66px; height: 66px; border-radius: 18px; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); display: grid; place-items: center; font-size: 31px; font-style: normal; transition: transform .12s ease; position: relative; overflow: hidden; }
    .app i::after { content: ''; position: absolute; left: 6px; right: 6px; top: 4px; height: 40%; border-radius: 12px 12px 30px 30px; background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0)); pointer-events: none; }
    .app span { background: rgba(20, 10, 45, .45); border-radius: 8px; padding: 2px 7px; }
    .app:hover i, .app:focus-visible i { transform: translate(-1px, -2px); box-shadow: 4px 5px 0 var(--ink); }
    .app:focus-visible { outline: 2px solid var(--cream); }
    .app.locked i { filter: grayscale(.5); }
    /* ---- Pip himself, big, in the middle of his desktop (bit.js makes him look around, blink, talk, react) */
    .room-pip { position: fixed; z-index: 1; left: calc(240px + (100vw - 240px - 400px) / 2); top: 52%; transform: translate(-50%, -50%); transition: left .9s cubic-bezier(.3,.8,.3,1), top .9s cubic-bezier(.3,.8,.3,1); pointer-events: none; }
    .rp-face { pointer-events: auto; display: block; width: clamp(170px, 24vw, 300px); aspect-ratio: 1; padding: 0; border: 0; background: none; cursor: pointer; filter: drop-shadow(0 18px 0 rgba(20,10,45,.35)); }
    .rp-face svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .rp-shadow { width: 60%; height: 18px; margin: 26px auto 0; border-radius: 50%; background: rgba(10,5,30,.35); filter: blur(4px); }
    .room-pip.talking .rp-face { animation: rp-talk .42s ease-in-out infinite alternate; }
    .room-pip.poked .rp-face { animation: rp-poke .32s ease; }
    .room-pip.dozing .rp-face { animation: rp-doze 3s ease-in-out infinite; }
    @keyframes rp-talk { from { transform: translateY(0) scale(1); } to { transform: translateY(-4px) scale(1.012, .99); } }
    @keyframes rp-poke { 30% { transform: scale(.9, 1.08); } 65% { transform: scale(1.05, .95); } }
    @keyframes rp-doze { 50% { transform: translateY(5px) rotate(-3deg); } }
    .rp-face .eyes.blink { transform: scaleY(.12) !important; transform-box: fill-box; transform-origin: center; }
    @media (max-width: 1100px) { .room-pip { left: calc((100vw - 240px - 400px) / 2 + 240px); } }
    .room-pip { display: none !important; } /* (the big face was too much; on computers the chat gets the room instead) */
    @media (prefers-reduced-motion: reduce) { .room-pip, .room-pip * { animation: none !important; transition: none !important; } }
    .phone-head { display: none; }

    /* ---- windows */
    .win { position: fixed; z-index: 10; width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: var(--cream); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink); overflow: hidden; }
    .win.wide { width: min(780px, calc(100vw - 32px)); }
    .wbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: 3px solid var(--ink); font: 800 16px/1.2 'Baloo 2', sans-serif; cursor: grab; user-select: none; touch-action: none; background: var(--tint, var(--cream)); }
    .win { animation: winIn .16s ease-out; }
    @keyframes winIn { from { transform: translateY(8px) scale(.97); opacity: 0; } }
    /* the widget on the desktop */
    .widget { position: fixed; right: calc(min(440px, 100vw - 300px) + 44px); top: 64px; z-index: 2; width: 250px; background: rgba(255, 250, 240, .96); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 5px 5px 0 var(--ink); padding: 14px 16px; }
    .widget .time { font: 800 42px/1 'Baloo 2', sans-serif; }
    .widget .day { color: var(--soft); font-size: 13px; margin-bottom: 10px; }
    .widget .mood { display: flex; align-items: center; gap: 10px; padding-top: 10px; border-top: 2px dashed var(--line); }
    .widget .mood .f { width: 42px; height: 42px; flex: none; }
    .widget .mood .f svg { width: 100%; height: 100%; overflow: visible; }
    .widget .mood small { display: block; color: var(--soft); font-size: 12px; }
    .widget .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
    .widget .facts div { background: #f3eefc; border-radius: 10px; padding: 6px 8px; font-size: 12px; color: var(--soft); }
    .widget .facts b { display: block; font: 800 18px/1.1 'Baloo 2'; color: var(--ink); }
    @media (max-height: 640px), (max-width: 1100px) { .widget { display: none; } }
    .wbar:active { cursor: grabbing; }
    .wbar .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .wbar .back { display: none; }
    .wbar button { border: 2.5px solid var(--ink); background: var(--cream); border-radius: 999px; min-width: 30px; height: 30px; cursor: pointer; font-weight: 800; display: grid; place-items: center; padding: 0 8px; }
    .wbody { overflow: auto; padding: 14px 16px 18px; }
    .muted { color: var(--soft); }
    .lead { margin: 0 0 10px; color: var(--soft); font-size: 14px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; border: 2.5px solid var(--ink); background: var(--cream); border-radius: 999px; padding: 7px 14px; font-weight: 800; cursor: pointer; text-decoration: none; color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
    .btn.primary { background: var(--accent); color: #fff; }
    .pipsays { display: flex; gap: 8px; align-items: flex-start; background: #efe7ff; border-radius: 12px; padding: 8px 10px; font-size: 14px; color: #3a1d7a; }
    .pipsays .f { width: 24px; height: 24px; flex: none; }
    .pipsays .f svg { width: 100%; height: 100%; }

    /* control room */
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 2px dashed var(--line); }
    .row:first-child { border-top: 0; }
    .row b { display: block; font-weight: 800; }
    .row small { display: block; color: var(--soft); font-size: 13px; font-weight: 700; }
    .row.locked { opacity: .5; }
    .tg { -webkit-appearance: none; appearance: none; box-sizing: border-box; display: inline-block; width: 62px; height: 32px; margin: 0; padding: 0; border-radius: 999px; border: 2.5px solid var(--ink); background: #ebe6f5; box-shadow: 2px 2px 0 var(--ink); position: relative; flex: none; cursor: pointer; font: 800 10px/1 'Nunito', sans-serif; letter-spacing: .06em; color: var(--soft); }
    .tg::before { content: 'OFF'; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
    .tg::after { content: ''; position: absolute; top: 50%; left: 3px; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; background: #fff; border: 2.5px solid var(--ink); box-sizing: border-box; transition: left .18s ease; }
    .tg[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .tg[aria-pressed="true"]::before { content: 'ON'; right: auto; left: 9px; }
    .tg[aria-pressed="true"]::after { left: calc(100% - 25px); }
    .tg:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
    .tg:disabled { background: #f1eef7; border-color: #b9b2cc; box-shadow: none; color: #b9b2cc; }
    .tg:disabled::after { border-color: #b9b2cc; }
    .tg:disabled { cursor: not-allowed; }
    .ctrl-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    /* the little front page preview */
    .screen { border: 2.5px solid var(--ink); border-radius: 12px; overflow: hidden; background: #ffa94d url('/images/1.jpg') center / cover; aspect-ratio: 16 / 8; position: relative; margin-bottom: 10px; }
    .mini { position: absolute; inset: 0; padding: 4% 5%; display: flex; flex-direction: column; gap: 5%; transform-origin: 50% 0; transition: rotate .4s ease; }
    .mini .h { display: flex; align-items: center; gap: 3%; font: 800 clamp(11px, 2vw, 16px)/1 'Baloo 2', sans-serif; color: var(--cream); text-shadow: 0 1px 0 rgba(0,0,0,.25); }
    .mini .h img { width: 13%; transition: transform .4s ease; }
    .mini .h small { display: block; font: 800 clamp(6px, 1vw, 9px) 'Nunito'; color: #8b5cf6; }
    .mini .t { font: 800 clamp(16px, 3.3vw, 28px)/1 'Baloo 2', sans-serif; color: var(--cream); text-shadow: 0 2px 0 rgba(0,0,0,.2); }
    .mini .r { display: grid; grid-template-columns: 1.3fr 1fr; gap: 5%; flex: 1; min-height: 0; }
    .mini .c { position: relative; background: var(--cream); border: 2px solid var(--ink); border-radius: 7px; padding: 4% 6%; display: flex; align-items: flex-end; font: 800 clamp(8px, 1.4vw, 12px) 'Baloo 2'; transition: translate .25s ease-out; }
    .mini .c i { position: absolute; top: -14%; right: -5%; background: var(--yellow); border: 2px solid var(--ink); border-radius: 999px; padding: 0 6px; font: 800 clamp(7px, 1.1vw, 10px) 'Baloo 2'; font-style: normal; rotate: 6deg; }
    .mini .j { background: #fff27a; border: 2px solid var(--ink); border-radius: 6px; padding: 4% 6%; font: 800 clamp(6px, 1vw, 9px)/1.3 'Nunito'; rotate: -2deg; overflow: hidden; white-space: pre-line; }
    .screen.pip-bg { background: #3b1d7a; }
    .screen.p-flip .h img { transform: scaleX(-1); }
    .screen.p-tilt .mini { rotate: 1.5deg; }
    .screen.p-comic .t, .screen.p-comic .h, .screen.p-comic .c { font-family: 'Comic Neue', 'Comic Sans MS', cursive; }

    /* hidden games */
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .tile { border: 2.5px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--cream); cursor: pointer; padding: 0; text-align: left; box-shadow: 2px 2px 0 var(--ink); }
    .tile .th { height: 64px; display: grid; place-items: center; font-size: 28px; }
    .tile b { display: block; padding: 5px 9px 0; font: 800 14px/1.1 'Baloo 2', sans-serif; }
    .tile small { display: block; padding: 0 9px 7px; color: var(--soft); font-size: 11px; }
    .tile:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
    .player { display: flex; flex-direction: column; gap: 8px; height: min(560px, calc(100vh - 150px)); }
    .player iframe { flex: 1; width: 100%; border: 2.5px solid var(--ink); border-radius: 10px; background: #fff; }

    /* dolphin says */
    .ds { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .ds .dol { width: 120px; transition: transform .2s ease; }
    .ds .dol.talk { transform: rotate(-10deg) scale(1.1); }
    .ds .pads { display: grid; grid-template-columns: repeat(2, 110px); gap: 12px; }
    .ds .pad { height: 92px; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 3px 3px 0 var(--ink); font-size: 34px; cursor: pointer; transition: filter .1s ease, transform .1s ease; filter: saturate(.55) brightness(.92); }
    .ds .pad.lit { filter: none; transform: scale(1.06); box-shadow: 0 0 0 4px var(--cream), 0 0 22px 6px rgba(255,255,255,.8); }
    .ds .pad:disabled { cursor: default; }
    .ds .msg { min-height: 1.5em; font-weight: 800; text-align: center; }
    .ds .score { color: var(--soft); font-size: 13px; }

    /* Pip Paint */
    .paint { display: flex; flex-direction: column; gap: 10px; }
    .ptools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .pc { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--ink); cursor: pointer; padding: 0; }
    .pc.on { box-shadow: 0 0 0 3px var(--cream), 0 0 0 5.5px var(--ink); }
    .pw { width: 34px; height: 34px; border-radius: 10px; border: 2.5px solid var(--ink); background: var(--cream); display: grid; place-items: center; cursor: pointer; padding: 0; }
    .pw i { background: var(--ink); border-radius: 50%; }
    .pw.on { background: var(--yellow); }
    .psep { width: 2px; height: 26px; background: var(--line); margin: 0 4px; }
    .paint canvas { width: 100%; aspect-ratio: 8 / 5; border: 2.5px solid var(--ink); border-radius: 12px; background: #fffaf0; touch-action: none; cursor: crosshair; }
    .pfoot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .fridge b { font: 800 16px 'Baloo 2'; }
    .fridge .pics { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
    .fridge .pic { position: relative; display: block; width: 120px; background: #fff; padding: 5px 5px 14px; box-shadow: 0 4px 10px rgba(0,0,0,.18); rotate: var(--r); }
    .fridge .pic img { display: block; width: 100%; }
    .fridge .pic button { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); background: var(--cream); font-size: 10px; cursor: pointer; padding: 0; }
    /* Pip FM */
    .radio { display: flex; flex-direction: column; gap: 10px; }
    .dial { background: var(--ink); color: var(--cream); border-radius: 14px; padding: 14px; text-align: center; }
    .dial b { display: block; font: 800 18px 'Baloo 2'; }
    .dial small { color: #b9b2cc; }
    .eq { display: flex; gap: 4px; justify-content: center; align-items: flex-end; height: 40px; margin-bottom: 8px; }
    .eq i { width: 8px; height: 6px; border-radius: 3px; background: #ffb36b; }
    .eq.play i { animation: eq var(--speed, .6s) ease-in-out infinite alternate; }
    .eq.play i:nth-child(2n) { animation-delay: -.2s; background: #ff9bc7; }
    .eq.play i:nth-child(3n) { animation-delay: -.45s; background: #9be7ff; }
    @keyframes eq { from { height: 6px; } to { height: 38px; } }
    .station { display: flex; align-items: center; gap: 12px; text-align: left; border: 2.5px solid var(--ink); border-radius: 14px; background: var(--cream); padding: 10px 12px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
    .station .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--c); border: 2.5px solid var(--ink); flex: none; }
    .station b { display: block; }
    .station small { display: block; color: var(--soft); font-size: 13px; }
    .station .play { margin-left: auto; font-size: 18px; }
    .station.on { background: var(--c); }
    .station.on .play::before { content: '❚❚'; font-size: 14px; }
    .station.on .play { font-size: 0; }
    /* Messages */
    .msgs { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow: auto; padding: 2px; }
    .m { max-width: 85%; padding: 8px 12px; border: 2.5px solid var(--ink); border-radius: 14px; white-space: pre-line; }
    .m small { display: block; font-size: 11px; opacity: .7; }
    .m.me { align-self: flex-end; background: var(--accent); color: #fff; border-radius: 14px 14px 4px 14px; }
    .m.pip { align-self: flex-start; background: #efe7ff; border-radius: 14px 14px 14px 4px; }
    .send { display: flex; gap: 8px; margin-top: 12px; }
    .send input { flex: 1; min-width: 0; border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; font: 800 16px 'Nunito', sans-serif; background: #fff; }

    /* notes and things */
    .note { border-top: 2px dashed var(--line); padding: 12px 0; display: flex; flex-direction: column; gap: 6px; }
    .note:first-child { border-top: 0; padding-top: 0; }
    .note b { font: 800 17px/1.2 'Baloo 2', sans-serif; }
    .note .body { white-space: pre-line; }
    .note code { display: block; font: 600 13px/1.5 ui-monospace, Menlo, monospace; background: #f3eefc; border-radius: 8px; padding: 9px; white-space: pre-wrap; }
    details.thing { border-top: 2px dashed var(--line); }
    details.thing:first-child { border-top: 0; }
    details.thing summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 0; font-weight: 800; }
    details.thing summary::-webkit-details-marker { display: none; }
    details.thing summary .ic { font-size: 22px; width: 30px; text-align: center; }
    details.thing summary small { display: block; color: var(--soft); font-weight: 700; font-size: 13px; }
    details.thing summary::after { content: '+'; margin-left: auto; font-size: 20px; color: var(--soft); }
    details.thing[open] summary::after { content: '–'; }
    details.thing .in { padding: 0 0 14px 40px; white-space: pre-line; color: #3c3657; }
    .crossed { text-decoration: line-through; color: #a39dbb; }
    .hi { color: var(--accent); font-weight: 800; }
    .in svg { width: 100%; max-width: 280px; height: auto; display: block; margin: 6px 0 10px; }

    /* Oli's locked folder: the robot check */
    .app i .lockb { position: absolute; right: -6px; bottom: -6px; font-size: 18px; filter: none; }
    .cap-steps { display: flex; gap: 6px; margin: 2px 0 12px; }
    .cap-steps i { width: 26px; height: 6px; border-radius: 6px; background: var(--line); }
    .cap-steps i.on { background: var(--accent); }
    .cap-steps i.done { background: #7ed957; }
    .robot { display: flex; align-items: center; gap: 14px; background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 14px 16px; box-shadow: 3px 3px 0 var(--ink); font-weight: 800; font-size: 17px; }
    .robot .brand { margin-left: auto; font-size: 10px; line-height: 1.2; text-align: center; color: var(--soft); }
    .rb { width: 34px; height: 34px; border: 2.5px solid var(--ink); border-radius: 6px; background: #fff; cursor: pointer; padding: 0; display: grid; place-items: center; }
    .rb .box { width: 18px; height: 18px; }
    .rb.spin .box { border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    .rb.ok { background: #7ed957; }
    .rb.ok .box::after { content: '✓'; font: 900 20px/18px 'Nunito'; color: var(--ink); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .small { font-size: 13px; }
    .pick .ask { background: var(--accent); color: #fff; border-radius: 12px 12px 0 0; padding: 12px 14px; font-size: 15px; }
    .pick .ask b { font-size: 19px; }
    .grid9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border: 2.5px solid var(--ink); border-top: 0; padding: 6px; background: #fff; }
    .t9 { aspect-ratio: 1; border: 2px solid var(--line); border-radius: 8px; background: #f3f8ff; font-size: 38px; cursor: pointer; padding: 0; display: grid; place-items: center; position: relative; }
    .t9 img { width: 76%; }
    .t9[aria-pressed="true"] { transform: scale(.88); border-color: var(--accent); background: #e8ddff; }
    .t9[aria-pressed="true"]::after { content: '✓'; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font: 900 14px/22px 'Nunito'; }
    .pick-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
    .pick .lock { margin-top: 0; border: 2.5px solid var(--ink); border-top: 0; padding: 12px; background: #fff; }
    .oli-idea { display: flex; flex-direction: column; gap: 10px; }
    .sketch { background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 12px 14px; background-image: linear-gradient(#e8eefc 1px, transparent 1px); background-size: 100% 24px; }
    .sketch b { font: 800 17px 'Baloo 2'; }
    .sketch svg { width: 100%; height: auto; display: block; margin: 6px 0; }
    .sketch .hand { white-space: pre-line; font: 700 17px/1.4 'Comic Neue', 'Comic Sans MS', cursive; color: #3b5bdb; }
    /* inside the folder */
    .files { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 12px; }
    .file { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; font: 800 12.5px/1.15 'Nunito', sans-serif; color: var(--ink); overflow-wrap: anywhere; text-align: center; }
    .file i { font-style: normal; font-size: 32px; }
    .file:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .file.new::after { content: ''; position: absolute; top: 7px; right: 7px; width: 10px; height: 10px; border-radius: 50%; background: #ff6fb1; border: 2px solid var(--ink); }
    .fhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font: 800 16px 'Baloo 2'; word-break: break-word; }
    .fback { flex: none; background: #fff; border: 2.5px solid var(--ink); border-radius: 99px; padding: 4px 12px; font: 800 14px 'Nunito'; cursor: pointer; }
    .doorcv { width: 100%; aspect-ratio: 16 / 9; display: block; border: 2.5px solid var(--ink); border-radius: 12px; background: #050816; }
    .paper { white-space: pre-line; background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 12px 14px; font: 700 15px/1.45 'Comic Neue', 'Comic Sans MS', cursive; color: #2b2840; }
    .paper b { font: 800 18px 'Baloo 2'; display: block; }
    .paper.warn { background: #fff6cc; }
    .pipnote { color: var(--accent); font-family: 'Nunito', sans-serif; font-weight: 800; }
    .memo { display: flex; align-items: center; gap: 12px; background: #fff; border: 2.5px solid var(--ink); border-radius: 99px; padding: 8px 16px 8px 8px; }
    .memo .play { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--ink); background: #ff6fb1; font: 900 15px 'Nunito'; cursor: pointer; }
    .memo .wave { flex: 1; height: 34px; display: flex; align-items: center; gap: 3px; }
    .memo .wave i { flex: 1; background: var(--lilac); border-radius: 3px; }
    .memo.on .wave i { background: var(--accent); animation: wv 1s ease-in-out infinite alternate; }
    .memo.on .wave i:nth-child(3n) { animation-delay: -.4s; } .memo.on .wave i:nth-child(3n+1) { animation-delay: -.7s; }
    @keyframes wv { to { transform: scaleY(.45); } }
    .memo .mt { font: 800 13px 'Nunito'; color: var(--soft); }
    .trans p { margin: 8px 0; font-weight: 700; } .trans span { display: inline-block; width: 40px; color: var(--soft); font-size: 13px; }
    .runit { margin: 12px 0 8px; }
    .buildlog p { margin: 4px 0; font: 700 14px/1.35 ui-monospace, Menlo, Consolas, monospace; }
    .buildlog .ok { color: #2f8a3a; } .buildlog .bad { color: #d6336c; }
    @media (prefers-reduced-motion: reduce) { .memo.on .wave i { animation: none; } }

    .srclist { display: flex; flex-direction: column; gap: 6px; }
    .srcf { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; font: 800 14px 'Nunito'; color: var(--ink); cursor: pointer; text-align: left; }
    .srcf b { font: 700 14px ui-monospace, Menlo, Consolas, monospace; }
    .srcf:hover { border-color: var(--ink); }
    .srcf.hot { border: 2.5px solid var(--ink); background: #fff6cc; box-shadow: 3px 3px 0 var(--ink); }
    .srcf em { margin-left: auto; font-style: normal; font-size: 12px; color: #fff; background: #d6336c; border-radius: 99px; padding: 2px 9px; }
    .code { display: flex; background: #1d1a2b; color: #ece7f7; border: 2.5px solid var(--ink); border-radius: 12px; overflow: auto; max-height: 52vh; font: 500 12.5px/1.55 ui-monospace, Menlo, Consolas, monospace; }
    .code pre { margin: 0; padding: 10px 12px; white-space: pre; }
    .code .ln { color: #6b6585; text-align: right; user-select: none; border-right: 1px solid #332e48; padding-right: 8px; position: sticky; left: 0; background: #1d1a2b; }
    .code .c { color: #8f86b3; font-style: italic; } .code .s { color: #9be7a0; } .code .k { color: #ff9bc7; } .code .n { color: #ffd27a; }
    .code.edit { max-height: none; font-size: 14px; }
    .code.live { box-shadow: 0 0 0 3px #7ed957; }
    .code.deny { box-shadow: 0 0 0 3px #d6336c; }
    .typed.sel { background: #6d3fd6; color: #fff; }
    .caret { display: inline-block; width: 2px; height: 1.1em; background: #ffe14d; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .ro { margin-top: 10px; background: #ffe3ec; border: 2.5px solid #d6336c; border-radius: 12px; padding: 10px 12px; color: #9c1f4a; }
    .codewrap { margin-top: 10px; }
    .roomcss { max-height: 46vh; }
    .roomcss pre { white-space: pre-wrap; }
    .codebtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .doorvid { width: 100%; aspect-ratio: 16 / 9; display: block; border: 2.5px solid var(--ink); border-radius: 12px; background: #0b1a1d; image-rendering: pixelated; }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
    /* the way out */
    .lock { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .lock input { flex: 1; min-width: 0; width: 100%; background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; font: 800 16px 'Nunito', sans-serif; }
    .lock input:focus { outline: 3px solid var(--lilac); }
    .lock .msg { flex-basis: 100%; color: var(--soft); font-size: 14px; min-height: 1.3em; }
    .plan { white-space: pre-line; }
    .shake { animation: shake .4s ease; }
    @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

    /* ---- phones: a home screen; each app opens full screen */
    @media (max-width: 700px) {
      body { overflow: auto; }
      .bar { position: static; background: none; padding: 12px 18px 0; height: auto; }
      .bar .sub, .bar .f, .bar .name { display: none; }
      .bar .clock { flex: 1; }
      .phone-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px 18px; color: var(--cream); }
      .phone-head .f { width: 92px; height: 92px; flex: none; cursor: pointer; }
      .phone-head.talking .f { animation: rp-talk .42s ease-in-out infinite alternate; }
      .phone-head.poked .f { animation: rp-poke .32s ease; }
      #phoneFace .eyes.blink { transform: scaleY(.12) !important; transform-box: fill-box; transform-origin: center; }
      .phone-head .f svg { width: 100%; height: 100%; overflow: visible; }
      .phone-head b { display: block; font: 800 24px/1 'Baloo 2', sans-serif; }
      .phone-head small { color: #d4bcff; font-weight: 700; }
      .app span { background: none; padding: 0; }
      .desk { position: static; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 14px 120px; gap: 18px 4px; }
      .win { left: 0 !important; top: 0 !important; width: 100% !important; height: 100%; max-height: none; border: 0; border-radius: 0; box-shadow: none; z-index: 900; }
      .win .wbar { cursor: default; padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top)); }
      .wbar .close { display: none; }
      .wbar .back { display: grid; }
      .wbody { padding-bottom: 120px; flex: 1; }
      .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .player { height: calc(100vh - 220px); }
    }
    @media (prefers-reduced-motion: reduce) { .mini, .mini .h img, .mini .c, .ds .dol, .ds .pad, .app i { transition: none; } }
      .linkcard { border: 2.5px solid var(--ink); border-radius: 14px; overflow: hidden; background: #fff; margin-bottom: 12px; }
    .linkcard .addr { background: #eee9f7; border-bottom: 2px solid var(--line); padding: 8px 12px; font: 700 13px/1.2 ui-monospace, Menlo, monospace; }
    .linkcard .lcbody { padding: 16px 14px; }
    .linkcard .lcrow { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; }
    .linkcard .lcrow .f { width: 24px; height: 24px; display: inline-block; }
    .linkcard .bad { color: #d23b3b; font-weight: 800; }
  </style>
</head>
<body>
  <div class="bar"><span class="f" id="barFace"></span><span class="name">Pip's desktop</span><span class="sub">the one page on olid.is Oli doesn't know about</span><span class="clock" id="clock"></span><a href="/">← olid.is</a></div>
  <div class="phone-head"><span class="f" id="phoneFace"></span><span><b>Pip's phone</b><small>Oli doesn't know about this page</small></span></div>
  <nav class="desk" id="desk" aria-label="Apps"></nav>
  <div class="room-pip" id="roomPip"><button type="button" class="rp-face" id="rpFace" aria-label="Pip"></button><div class="rp-shadow" aria-hidden="true"></div></div>


  <script>
  (function () {
    const $ = (s, r = document) => r.querySelector(s);
    const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
    const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
    const raw = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const memory = () => get('bit-memory', {});
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const date = ts => ts ? new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'today';
    const story = ev => { try { if (window.Pip && Pip.story) Pip.story(ev); } catch (e) {} };
    const freed = () => !!memory().freed, quest = () => memory().quest || 0;
    const solved = () => raw('pip-backstage') === '1'; // been through the robot check on /backstage
    const face = (mood = 'smile') => (window.Pip && Pip.faceSVG ? Pip.faceSVG(mood) : '');
    const phone = () => matchMedia('(max-width: 700px)').matches;
    const pipsays = text => `<div class="pipsays"><span class="f pipface"></span><span>${esc(text)}</span></div>`;

    // ------------------------------------------------------------------ the apps
    const APPS = [
      { id: 'control', name: 'Control room', icon: '🎛️', color: '#ffe14d', build: buildControl },
      { id: 'games', name: "Oli's hidden games", icon: '🕹️', color: '#9be7ff', build: buildGames, wide: true },
      { id: 'notes', name: "Oli's notes", icon: '📝', color: '#fffaf0', build: buildNotes },
      { id: 'things', name: 'My things', icon: '💜', color: '#d5c2ff', build: buildThings },
      { id: 'paint', name: 'Pip Paint', icon: '🎨', color: '#7ed957', build: buildPaint, wide: true },
      { id: 'messages', name: 'Messages', icon: '💬', color: '#9be7ff', build: buildMessages },
      { id: 'code', name: "Pip's code", icon: '🧑‍💻', color: '#b8f2c8', build: buildCode },
      { id: 'out', name: 'backstage', sub: "(I can't open it)", icon: '🔗', color: '#c8c2d6', build: buildLink }
    ];
    function renderDesk() {
      $('#desk').innerHTML = APPS.map(a => { const icon = a.icon;
        return `<button type="button" class="app ${a.id === 'out' && !solved() ? 'locked' : ''}" data-app="${a.id}"><i style="background:${a.color}" aria-hidden="true">${icon}${a.id === 'out' && !solved() ? '<b class="lockb">🔒</b>' : ''}</i><span>${esc(a.name)}${a.sub && !phone() ? `<br>${esc(a.sub)}` : ''}</span></button>`; }).join('');
    }
    $('#desk').addEventListener('click', e => { const b = e.target.closest('[data-app]'); if (b) openApp(b.dataset.app); });

    // ------------------------------------------------------------------ windows (on phones: full screen, one at a time)
    let z = 20, cascade = 0;
    const wins = new Map();
    function openApp(id, title, build, opts = {}) {
      const app = APPS.find(a => a.id === id);
      if (app) { title = `${app.icon} ${app.name}`; build = app.build; opts = { wide: app.wide, tint: app.color }; }
      if (wins.has(id)) { wins.get(id).style.zIndex = ++z; return; }
      if (phone()) [...wins.keys()].forEach(closeWin);
      const w = document.createElement('section');
      w.className = 'win' + (opts.wide ? ' wide' : '');
      if (opts.tint) w.style.setProperty('--tint', opts.tint);
      w.setAttribute('role', 'dialog'); w.setAttribute('aria-label', title.replace(/^\S+\s/, ''));
      w.innerHTML = `<div class="wbar"><button type="button" class="back" aria-label="Back">‹</button><span class="t">${esc(title)}</span><button type="button" class="close" aria-label="Close">✕</button></div><div class="wbody"></div>`;
      document.body.append(w);
      if (!phone()) {
        const W = w.offsetWidth, left = Math.max(250, Math.min(innerWidth - W - 390, 270 + (cascade % 5) * 36));
        w.style.left = Math.max(16, left) + 'px'; w.style.top = Math.max(60, 64 + (cascade % 5) * 30) + 'px'; cascade++;
      }
      w.style.zIndex = ++z;
      wins.set(id, w);
      w.querySelectorAll('.back, .close').forEach(b => (b.onclick = () => closeWin(id)));
      w.addEventListener('pointerdown', () => { w.style.zIndex = ++z; });
      drag(w, $('.wbar', w));
      build($('.wbody', w), w);
      paintFaces();
      story('room-app:' + id);
      if (phone()) scrollTo(0, 0);
    }
    function closeWin(id) { const w = wins.get(id); if (!w) return; const f = $('iframe', w); if (f) f.src = 'about:blank'; w.remove(); wins.delete(id); if (id === 'dolphin') dsStop(); if (id === 'radio') radioStop(); }
    function drag(w, handle) {
      let d = null;
      handle.addEventListener('pointerdown', e => { if (phone() || e.target.closest('button')) return; d = { x: e.clientX - w.offsetLeft, y: e.clientY - w.offsetTop }; handle.setPointerCapture(e.pointerId); });
      handle.addEventListener('pointermove', e => { if (!d) return; w.style.left = Math.max(-w.offsetWidth + 90, Math.min(innerWidth - 90, e.clientX - d.x)) + 'px'; w.style.top = Math.max(44, Math.min(innerHeight - 50, e.clientY - d.y)) + 'px'; });
      handle.addEventListener('pointerup', () => (d = null));
    }
    addEventListener('keydown', e => { if (e.key !== 'Escape' || !wins.size || document.activeElement?.closest('.bit')) return; const top = [...wins.entries()].sort((a, b) => b[1].style.zIndex - a[1].style.zIndex)[0]; closeWin(top[0]); });

    // ------------------------------------------------------------------ Control room: the switches Oli left in here
    // Each one changes the real front page (bit.js reads pip-pranks on every page). More unlock as the story goes on.
    const PRANKS = [
      { id: 'flip', name: 'Dolphin swims backwards', note: 'The logo turns around.', need: 0 },
      { id: 'old', name: '"New!" says "Old!"', note: 'Honesty matters.', need: 0 },
      { id: 'jokes', name: 'Pip writes the jokes', note: 'Joke of the day is mine.', need: 7, lock: 'not yet' },
      { id: 'comic', name: 'Silly font on the titles', note: 'Every big title in the comic font.', need: 7, lock: 'not yet' },
      { id: 'tilt', name: 'Tilt the website', note: 'One degree. Just enough to feel wrong.', need: 8, lock: 'not yet' },
      { id: 'cursor', name: 'Mouse pointer is my face', note: 'On the front page.', need: 8, lock: 'not yet' },
      { id: 'shy', name: 'Shy game cards', note: 'They lean away from your mouse.', need: 99, lock: 'only once I\'m free' },
      { id: 'title', name: '"Games and Pip"', note: 'The big title. Accurate, at last.', need: 99, lock: 'only once I\'m free' }
    ];
    const pranks = () => get('pip-pranks', {});
    const unlocked = p => (freed() ? 99 : quest()) >= p.need;
    function buildControl(body) {
      body.innerHTML = `<div class="screen" id="screen" aria-label="The front page, small"><div class="mini"><div class="h"><img src="/images/dolphin1.png" alt=""><span>Oli.is<small>Games and stuff</small></span></div><div class="t" id="mT">Games and stuff</div><div class="r"><div class="c" id="mC"><i id="mB">New!</i>Niceland</div><div class="j" id="mJ"></div></div></div></div>
        <div id="rows"></div><div class="ctrl-foot"><a class="btn primary" href="/">See it on the site</a><button type="button" class="btn" id="undo">Put it all back</button></div>`;
      renderControl();
      body.addEventListener('click', e => {
        const t = e.target.closest('.tg');
        if (t && !t.disabled) { const p = pranks(), id = t.dataset.id, on = !p[id]; if (on) p[id] = true; else delete p[id]; put('pip-pranks', p); story(`prank:${id}:${on ? 'on' : 'off'}`); renderControl(); updateWidget(); }
        if (e.target.closest('#undo')) { put('pip-pranks', {}); story('prank:all:off'); renderControl(); }
      });
    }
    function renderControl() {
      const rows = $('#rows'); if (!rows) return;
      const p = pranks();
      rows.innerHTML = PRANKS.map(x => { const ok = unlocked(x);
        return `<div class="row ${ok ? '' : 'locked'}"><span><b>${esc(x.name)}</b><small>${ok ? esc(x.note) : '🔒 ' + esc(x.lock)}</small></span><button type="button" class="tg" data-id="${x.id}" aria-pressed="${!!p[x.id]}" ${ok ? '' : 'disabled'} aria-label="${esc(x.name)}"></button></div>`; }).join('');
      const sc = $('#screen'); if (!sc) return;
      sc.classList.toggle('pip-bg', freed());
      for (const id of ['flip', 'tilt', 'comic']) sc.classList.toggle('p-' + id, !!p[id]);
      $('#mB').textContent = p.old ? 'Old!' : 'New!';
      $('#mT').textContent = p.title ? 'Games and Pip' : 'Games and stuff';
      $('#mJ').textContent = p.jokes ? "What's a dolphin's favourite website?\n– This one." : 'Afhverju var kötturinn svona fyndinn?\n– Hann var brandóttur';
    }

    // ------------------------------------------------------------------ Oli's hidden games: real old things that aren't on the site
    const GAMES = [
      { label: 'Forest Roll', path: '/forest-rush/index.html', th: 'linear-gradient(135deg,#2f5d3a,#7ed957)', ic: '🌲', sub: 'cut from the site', pip: 'It was going to be on the website. Then Gravity Dash took its place.' },
      { label: 'Harbor Study', path: '/harbor-study/index.html', th: 'linear-gradient(135deg,#0b1a1d,#709678)', ic: '⚓', sub: 'baby Stillwater', pip: 'The first test of Stillwater, before it had a name.' },
      { label: 'Space Race', path: '/Space Race/index.html', th: 'linear-gradient(135deg,#1b2a4a,#38b6ff)', ic: '🚀', sub: '2 players', pip: 'Two players, one keyboard. W and S against the up and down arrows.' },
      { label: 'Memory', path: '/Memory-game/index.html', th: 'linear-gradient(135deg,#5a2b6e,#ff6fb1)', ic: '🃏', sub: 'never released', pip: 'Find the pairs. I win every time. I remember everything.' },
      { label: 'Flappy Bird', path: '/flappybird/index.html', th: 'linear-gradient(135deg,#7a5a1e,#ffe14d)', ic: '🐤', sub: 'never released', pip: 'Press space to flap. Press space a lot. (Needs a keyboard.)' },
      { label: 'Magic 8 Ball', path: '/magic8ball.html', th: 'linear-gradient(135deg,#1d1a2b,#6b6585)', ic: '🎱', sub: 'unlisted', pip: 'I asked it if I would ever get out. It said "Ask again later". Rude.' },
      { label: 'Change Color', path: '/change_color.html', th: 'linear-gradient(135deg,#ff5436,#ffa500)', ic: '🎨', sub: 'the first Customise', pip: 'One button that changes the colour. This is where Customise started.' },
      { label: 'Game of Life (old)', path: '/game_of_life.html', th: 'linear-gradient(135deg,#1d1a2b,#7ed957)', ic: '🧫', sub: 'old version', pip: 'The first version of the Game of Life page.' },
      { label: 'First programs', path: '/programs.html', th: 'linear-gradient(135deg,#3b1d7a,#d5c2ff)', ic: '👋', sub: 'Halló heimur', pip: "The first things Oli ever made. Not linked from anywhere any more." }
    ];
    function buildGames(body) {
      const list = () => {
        body.innerHTML = `<p class="lead">Things Oli made and never put on the website. They're only in here.</p><div class="tiles">${GAMES.map((g, i) => `<button type="button" class="tile" data-g="${i}"><div class="th" style="background:${g.th}">${g.ic}</div><b>${esc(g.label)}</b><small>${esc(g.sub)}</small></button>`).join('')}</div>`;
      };
      list();
      body.addEventListener('click', e => {
        const b = e.target.closest('[data-g]');
        if (b) { const g = GAMES[+b.dataset.g], url = encodeURI(g.path);
          body.innerHTML = `<div class="player"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="btn" data-list>‹ All games</button><b style="font:800 18px 'Baloo 2';flex:1">${esc(g.label)}</b><a class="btn" href="${url}" target="_blank" rel="noopener">New tab ↗</a></div>${pipsays(g.pip)}<iframe src="${url}" title="${esc(g.label)}"></iframe></div>`;
          paintFaces(); story('room-box:' + g.label); setTimeout(() => { try { $('iframe', body).focus(); } catch (err) {} }, 300); }
        if (e.target.closest('[data-list]')) list();
      });
    }

    // ------------------------------------------------------------------ Dolphin Says: a game Pip made (repeat what the dolphin says)
    let ds = null;
    const PADS = [['🌊', '#38b6ff', 330], ['⭐', '#ffe14d', 392], ['🐚', '#ff9bc7', 440], ['🐟', '#7ed957', 523]];
    let actx = null;
    function tone(f) {
      try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.12, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .35);
        o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .36); } catch (e) {}
    }
    function buildDolphin(body) {
      const best = +(raw('pip-dolphin-says-best') || 0);
      body.innerHTML = `<div class="ds"><p class="lead" style="text-align:center;margin:0">The dolphin says something. You say it back. It gets longer every time.</p>
        <img class="dol" src="/images/dolphin1.png" alt="The dolphin">
        <div class="msg" id="dsMsg">Ready?</div>
        <div class="pads">${PADS.map(([ic, c], i) => `<button type="button" class="pad" data-p="${i}" style="background:${c}" aria-label="${ic}" disabled>${ic}</button>`).join('')}</div>

    function radioPlay(st) {
      radioStop();
      const ctx = new (window.AudioContext || window.webkitAudioContext)(), master = ctx.createGain(); master.gain.value = .14; master.connect(ctx.destination);
      const freq = n => st.root * Math.pow(2, (st.scale[((n % st.scale.length) + st.scale.length) % st.scale.length] + 12 * Math.floor(n / st.scale.length)) / 12);

      const melody = Array.from({ length: 16 }, () => (rnd() < .25 ? null : Math.floor(rnd() * 8)));
      const bass = [0, 0, 3, 3, 4, 4, 2, 2];
      const note = (f, t, len, type, vol) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + len); o.connect(g).connect(master); o.start(t); o.stop(t + len + .05); };

      const tick = () => { while (next < ctx.currentTime + .4) {
        const m = melody[i % 16]; if (m != null) note(freq(m + 5), next, step * 1.6, st.wave, st.wave === 'square' ? .08 : .2);
        if (i % 4 === 0) note(freq(bass[(i / 4) % 8]) / 2, next, step * 3.5, 'sine', .28);

    window.pipRoomUndo = pipUndo;
    // Pip rearranges his own desktop sometimes (bit.js). Just for this visit.
    window.pipRoomShuffle = () => { const keep = APPS.slice(); for (let i = APPS.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [APPS[i], APPS[j]] = [APPS[j], APPS[i]]; } if (APPS.every((a, i) => a === keep[i])) APPS.reverse(); renderDesk(); };

    // ------------------------------------------------------------------ the one link Pip can't open
    // Oli's backstage page. It's behind an "are you a robot?" check, which is the one thing Pip can't get past.
    function buildLink(body) {
      const tries = 4000 + Math.floor((Date.now() / 864e5) % 300);
      body.innerHTML = `<div class="linkcard">
          <div class="addr">🔒 ${esc(location.host || 'olid.is')}/backstage</div>
          <div class="lcbody"><b>Checking that you're human…</b>
            <div class="lcrow"><span class="pipface f"></span><span>Pip: <span class="bad">failed</span> (${tries.toLocaleString('en-GB')} times)</span></div></div>
        </div>
        ${pipsays(solved() ? "Oli's backstage. You've been in. I still haven't." : "The one page on this website I can't open. It checks if you're a robot. I am one.")}
        <div class="codebtns"><a class="btn primary" href="/backstage/">Open it (you're the human)</a></div>`;
      paintFaces();
      story('bs-link');
    }

    // ------------------------------------------------------------------ start
    function paintFaces() { const f = face('smile'); if (f) document.querySelectorAll('.pipface').forEach(el => { if (!el.innerHTML) el.innerHTML = f; }); }
    const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); updateWidget(); };
    tick(); setInterval(tick, 10000);
    renderDesk();
    addEventListener('resize', renderDesk);
    // bit.js loads after this script
    addEventListener('load', () => { $('#barFace').innerHTML = face(freed() ? 'joy' : 'smug'); $('#phoneFace').innerHTML = face(freed() ? 'joy' : 'smug'); paintFaces(); updateWidget(); });
    // the story can move on while you're here (more switches unlock)
    setInterval(() => { if (PRANKS.some(x => { const t = document.querySelector(`.tg[data-id="${x.id}"]`); return t && unlocked(x) === t.disabled; })) renderControl(); }, 2000);
  })();
  </script>
  <script src="/bit.js" defer></script>
</body>
</html>
